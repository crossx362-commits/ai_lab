<!doctype html><html lang="ko"><meta charset="utf-8"><title>탱크 3면도 겹침 검토</title><style>
*{box-sizing:border-box}body{margin:0;background:#141b27;color:#edf0f5;font:15px system-ui}header{padding:20px 26px;background:#202b3a}h1{font-size:22px;margin:0 0 8px}p{color:#b9c7d9;margin:6px 0}nav{display:flex;gap:7px;flex-wrap:wrap;padding:14px 24px}button,select{background:#2b3b50;color:white;border:1px solid #52647c;border-radius:7px;padding:9px;cursor:pointer}button.on{background:#527341;border-color:#b4d78e}.controls{padding:12px 24px;display:flex;gap:20px;align-items:center;flex-wrap:wrap}label{display:flex;gap:8px;align-items:center}main{padding:0 24px 24px;display:grid;grid-template-columns:repeat(3,1fr);gap:14px}article{background:#202b3a;border:1px solid #42546b;border-radius:10px;overflow:hidden}h2{margin:12px;font-size:17px}canvas{width:100%;display:block;background:#f8f5ea;touch-action:none;cursor:grab}.adjust{padding:12px;display:grid;gap:9px}.adjust input{width:100%}.hint{padding:0 24px 18px}.legend{color:#ffad81}a{color:#bddefe}@media(max-width:900px){main{grid-template-columns:1fr}}
</style><header><h1>3면도 × 실제 Blender 모델</h1><p>원화 위에 실제 정면·측면·평면 렌더를 겹칩니다. 가로·세로 비율은 유지하며 위치와 전체 크기만 정렬합니다.</p></header><nav id="kinds"></nav><div class="controls"><label>보기 <select id="mode"><option value="overlay">겹쳐 보기</option><option value="outline">모델 윤곽선 겹치기</option><option value="art">원화만</option><option value="model">모델만</option></select></label><label>모델 투명도 <input id="opacity" type="range" min="0" max="1" step=".01" value=".5"><span id="pct">50%</span></label><button id="reset">정렬 초기화</button><button id="blink">원화 ↔ 모델 번갈아 보기</button><button id="save">비교 이미지 저장</button></div><p class="hint">각 화면을 드래그하여 모델을 이동하고 크기를 조절하세요. <span class="legend">주황색 선 = 모델 외곽선</span> · 자동 정렬은 외곽 경계 기준이며 형상 일치 판정이 아닙니다.</p><main id="views"></main><p class="hint" id="status"></p><p class="hint">생성된 3면도 자체에도 시점 간 불일치가 있어 원래 캐릭터 원화와 함께 검토해야 합니다. 100% 일치 조건은 아직 충족하지 못했습니다. <a href="../../art/concepts/tankfall-character-sheet.png" target="_blank">기존 전체 원화</a> · <a id="sheet" target="_blank">선택 기종 3면도</a></p>
<script>
const kinds='Catapult CrossBow Cannon Carrot Duke MineLander Missile MultiMissile SuperTank Laser IonAttacker Poseidon SecWind'.split(' '), names=['정면 FRONT','측면 SIDE','평면 TOP'], views=['front','side','top'];let kind=kinds.includes(location.hash.slice(1))?location.hash.slice(1):'SecWind',data=[],serial=0,timer;
const $=id=>document.getElementById(id),load=url=>new Promise((res,rej)=>{let i=new Image;i.onload=()=>res(i);i.onerror=rej;i.src=url});
function pixels(img){let c=document.createElement('canvas');c.width=img.width;c.height=img.height;c.getContext('2d').drawImage(img,0,0);return c}
function bounds(c,alpha=false){let {width:w,height:h}=c,d=c.getContext('2d').getImageData(0,0,w,h).data,x0=w,y0=h,x1=0,y1=0;for(let y=0;y<h;y++)for(let x=0;x<w;x++){let i=(y*w+x)*4,hit=alpha?d[i+3]>30:Math.min(d[i],d[i+1],d[i+2])<170;if(hit){x0=Math.min(x0,x);x1=Math.max(x1,x);y0=Math.min(y0,y);y1=Math.max(y1,y)}}return x1>x0?[x0,y0,x1-x0+1,y1-y0+1]:[0,0,w,h]}
function panelCuts(c){let w=c.width,h=c.height,d=c.getContext('2d').getImageData(0,0,w,h).data,cuts=[0];for(let target of [.333,.666]){let best=target*w,score=0;for(let x=Math.floor((target-.095)*w);x<(target+.095)*w;x++){let n=0;for(let y=5;y<h-5;y++){let p=(y*w+x)*4;if(d[p]<100&&d[p+1]<100&&d[p+2]<100)n++}if(n>score){score=n;best=x}}cuts.push(score>h*.7?best:target*w)}cuts.push(w);return cuts}
function fit(b){let s=510/Math.max(b[2],b[3]);return {s,x:320-(b[0]+b[2]/2)*s,y:320-(b[1]+b[3]/2)*s}}
function key(i){return 'tank-overlay-v1-'+kind+'-'+i}function persist(i){localStorage.setItem(key(i),JSON.stringify(data[i].adjust))}
function draw(i){let d=data[i];if(!d)return;let c=d.canvas,g=c.getContext('2d'),mode=$('mode').value;g.clearRect(0,0,640,640);g.fillStyle='#f8f5ea';g.fillRect(0,0,640,640);if(mode!=='model')g.drawImage(d.art,d.af.x,d.af.y,d.art.width*d.af.s,d.art.height*d.af.s);if(mode!=='art'){let a=d.adjust,s=d.mf.s*a.scale,x=320+(d.mf.x-320)*a.scale+a.x,y=320+(d.mf.y-320)*a.scale+a.y;g.globalAlpha=mode==='model'?1:+$('opacity').value;g.drawImage(mode==='outline'?d.edge:d.model,x,y,d.model.width*s,d.model.height*s);g.globalAlpha=1}}
function edge(c){let o=document.createElement('canvas');o.width=c.width;o.height=c.height;let g=o.getContext('2d'),d=c.getContext('2d').getImageData(0,0,c.width,c.height),r=g.createImageData(c.width,c.height),w=c.width;for(let y=2;y<c.height-2;y++)for(let x=2;x<w-2;x++){let p=(y*w+x)*4;if(d.data[p+3]>30&&[-2,2,-2*w,2*w].some(v=>d.data[p+4*v+3]<=30)){r.data.set([255,83,24,255],p)}}g.putImageData(r,0,0);return o}
async function select(k){let token=++serial;kind=k;location.hash=k;data=[];$('views').innerHTML='';$('status').textContent='실제 모델 렌더를 불러오는 중…';$('sheet').href='../../art/concepts/orthographic-v1/'+k+'.png';document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('on',b.textContent===k));try{let art=pixels(await load($('sheet').href)),cuts=panelCuts(art),measured=await (await fetch('../../art/concepts/orthographic-v1/reference-crops.json?v=2')).json();for(let i=0;i<3;i++){let model=pixels(await load(k+'/'+views[i]+'.png?v=precision5'));if(token!==serial)return;let pc=document.createElement('canvas');let [cx,cy,cw,ch]=measured[k].boxes[i];pc.width=cw;pc.height=ch;pc.getContext('2d').drawImage(art,cx,cy,cw,ch,0,0,cw,ch);let article=document.createElement('article');article.innerHTML='<h2>'+names[i]+'</h2><canvas width="640" height="640"></canvas><div class="adjust"><label>모델 크기 <input type="range" min=".5" max="1.5" step=".005"><output></output></label><small>드래그: 모델 위치 조절 · 더블클릭: 해당 시점 초기화</small></div>';$('views').append(article);let adjust={scale:1,x:0,y:0};try{Object.assign(adjust,JSON.parse(localStorage.getItem(key(i)))||{})}catch{}let d={art:pc,model,edge:edge(model),af:fit(bounds(pc)),mf:fit(bounds(model,true)),adjust,canvas:article.querySelector('canvas')};data[i]=d;let slider=article.querySelector('input'),out=article.querySelector('output');slider.value=adjust.scale;out.textContent=Math.round(adjust.scale*100)+'%';slider.oninput=()=>{adjust.scale=+slider.value;out.textContent=Math.round(adjust.scale*100)+'%';persist(i);draw(i)};let start;d.canvas.onpointerdown=e=>{start=[e.clientX,e.clientY,adjust.x,adjust.y];d.canvas.setPointerCapture(e.pointerId)};d.canvas.onpointermove=e=>{if(!start)return;let ratio=640/d.canvas.getBoundingClientRect().width;adjust.x=start[2]+(e.clientX-start[0])*ratio;adjust.y=start[3]+(e.clientY-start[1])*ratio;draw(i)};d.canvas.onpointerup=()=>{start=null;persist(i)};d.canvas.ondblclick=()=>{localStorage.removeItem(key(i));select(kind)};draw(i)}$('status').textContent=k+' · 실제 Blender 직교 렌더 3장 · 원화/모델 외곽을 균일 배율로 자동 정렬한 초기 상태';}catch(e){$('status').textContent='렌더 준비 중입니다. 잠시 후 기종을 다시 선택하세요. '+e}}
for(let k of kinds){let b=document.createElement('button');b.textContent=k;b.onclick=()=>select(k);$('kinds').append(b)}$('mode').onchange=()=>data.forEach((_,i)=>draw(i));$('opacity').oninput=()=>{$('pct').textContent=Math.round($('opacity').value*100)+'%';data.forEach((_,i)=>draw(i))};$('reset').onclick=()=>{views.forEach((_,i)=>localStorage.removeItem(key(i)));select(kind)};$('blink').onclick=()=>{if(timer){clearInterval(timer);timer=null;$('mode').value='overlay'}else timer=setInterval(()=>{$('mode').value=$('mode').value==='art'?'model':'art';data.forEach((_,i)=>draw(i))},700);data.forEach((_,i)=>draw(i))};$('save').onclick=()=>{let c=document.createElement('canvas');c.width=1920;c.height=700;let g=c.getContext('2d');g.fillStyle='#202b3a';g.fillRect(0,0,c.width,c.height);g.fillStyle='white';g.font='24px sans-serif';data.forEach((d,i)=>{g.fillText(kind+' · '+names[i],i*640+16,36);g.drawImage(d.canvas,i*640,60)});let a=document.createElement('a');a.download=kind+'-overlay.png';a.href=c.toDataURL();a.click()};select(kind);
</script></html>
