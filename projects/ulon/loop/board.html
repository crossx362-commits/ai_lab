<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULON · 개발 현황 보드</title>
<style>
:root {
  --bg: #0b0a08;
  --panel: #17140f;
  --panel2: #1e1a14;
  --ink: #f3ead6;
  --muted: #9a8d74;
  --line: #3a3426;
  --gold: #d4af6a;
  --gold2: #f0d78a;
  --ok: #6fbf73;
  --ok2: #b6f0bc;
  --warn: #e0b04a;
  --bad: #d45b4a;
  --mid: #6aa8d8;
  --high: #d47a3a;
  --shadow: 0 10px 40px rgba(0,0,0,.35);
}
* { box-sizing: border-box; }
html, body { margin: 0; background:
  radial-gradient(1200px 500px at 10% -10%, #2a2214 0%, transparent 55%),
  radial-gradient(900px 400px at 100% 0%, #1a1410 0%, transparent 50%),
  var(--bg);
  color: var(--ink); font: 13.5px/1.45 "IBM Plex Sans KR","Apple SD Gothic Neo","Noto Sans KR",sans-serif; }
body { min-height: 100vh; }
header.cmd {
  position: sticky; top: 0; z-index: 20;
  display: grid; grid-template-columns: auto 1fr auto; gap: 16px; align-items: center;
  padding: 10px 18px; background: rgba(11,10,8,.92); backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; }
.sigil {
  width: 36px; height: 36px; border: 1px solid var(--gold); border-radius: 8px;
  display: grid; place-items: center; color: var(--gold); font-weight: 800; letter-spacing: .08em;
  box-shadow: inset 0 0 12px rgba(212,175,106,.25);
}
.brand h1 { margin: 0; font-size: 15px; letter-spacing: .16em; color: var(--gold2); }
.brand small { display: block; color: var(--muted); letter-spacing: .08em; font-size: 10px; }
.kpis { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; }
.badge { padding: 3px 9px; border-radius: 999px; font-weight: 700; font-size: 11px; letter-spacing: .04em; }
.b-run { background: #16351e; color: var(--ok2); box-shadow: 0 0 0 1px #2a6a38 inset, 0 0 16px rgba(111,191,115,.25); }
.b-wait { background: #3a3010; color: #f0d78a; }
.b-stop { background: #3a2018; color: #f0b0a4; }
.b-fail { background: #5a1818; color: #ffc0b8; }
.b-off { background: #2a2a2a; color: #bbb; }
.pulse { width: 8px; height: 8px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 10px var(--ok); animation: pulse 1.6s infinite; }
@keyframes pulse { 50% { opacity: .35; transform: scale(.7); } }
button { cursor: pointer; background: #2a261e; color: var(--ink); border: 1px solid var(--line); padding: 7px 12px; border-radius: 7px; }
button.danger { border-color: var(--bad); color: #f2c2ba; }
button.ok { border-color: var(--ok); color: var(--ok2); }
button.ghost { background: transparent; }
main { padding: 16px; display: grid; gap: 14px; max-width: 1680px; margin: 0 auto; }
.row { display: grid; gap: 14px; }
.row.metrics { grid-template-columns: repeat(4, 1fr); }
.row.split { grid-template-columns: 1.15fr .85fr; }
section.panel {
  background: linear-gradient(180deg, var(--panel2), var(--panel));
  border: 1px solid var(--line); border-radius: 14px; padding: 14px 16px; box-shadow: var(--shadow);
}
h2 { margin: 0 0 10px; font-size: 12px; letter-spacing: .18em; text-transform: uppercase; color: var(--gold); }
.metric { display: grid; grid-template-columns: 72px 1fr; gap: 10px; align-items: center; }
.metric b { font-size: 22px; display: block; }
.metric span { color: var(--muted); font-size: 12px; }
.ring { width: 72px; height: 72px; }
.focus { border-color: #5a4a28; background: linear-gradient(90deg, rgba(212,175,106,.08), transparent 40%), var(--panel); }
.focus p { margin: 0; color: #e8dcc0; }
.steps { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; }
.step { padding: 10px; border-radius: 10px; background: #15130f; border: 1px solid var(--line); min-height: 92px; }
.step .pri { font-weight: 800; color: var(--gold); }
.step.p0 { border-color: #8a2f24; }
.step.p1 { border-color: #8a5a18; }
.step ul { margin: 6px 0 0; padding-left: 16px; color: var(--muted); }
.inbox-form { display: flex; gap: 8px; flex-wrap: wrap; }
.inbox-form textarea { flex: 1; min-width: 220px; min-height: 48px; background: #0e0d0b; color: var(--ink); border: 1px solid var(--gold); border-radius: 8px; padding: 8px; }
.kanban { display: grid; grid-template-columns: repeat(6, minmax(150px, 1fr)); gap: 8px; overflow-x: auto; }
.col { background: #12100c; border: 1px solid var(--line); border-radius: 10px; padding: 8px; min-height: 140px; }
.col.blocked { border-color: var(--bad); }
.col h3 { margin: 0 0 8px; font-size: 11px; color: var(--muted); display: flex; justify-content: space-between; }
.col h3 em { font-style: normal; color: var(--gold2); }
.card { background: #221f18; border: 1px solid var(--line); border-radius: 8px; padding: 8px; margin-bottom: 8px; }
.d-하 { border-left: 4px solid #7dba8a; }
.d-중 { border-left: 4px solid var(--mid); }
.d-상 { border-left: 4px solid var(--high); }
.empty { color: var(--muted); font-size: 12px; padding: 18px 6px; text-align: center; }
.filters { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 8px; }
select, input[type=text] { background: #0e0d0b; color: var(--ink); border: 1px solid var(--line); border-radius: 6px; padding: 5px 8px; }
.timeline { display: flex; gap: 3px; flex-wrap: wrap; align-items: flex-end; min-height: 36px; }
.tick { width: 13px; height: 28px; border-radius: 3px; cursor: pointer; }
.tick:hover { transform: scaleY(1.15); }
.t-ok { background: var(--ok); }
.t-noc { background: var(--warn); }
.t-fail { background: var(--bad); }
.t-to { background: #6a6a6a; }
.bars { display: flex; align-items: flex-end; gap: 2px; height: 48px; margin-top: 8px; }
.md { overflow: auto; max-height: 420px; }
.md table, table.grid { border-collapse: collapse; width: 100%; }
.md th, .md td, table.grid th, table.grid td { border: 1px solid var(--line); padding: 5px 7px; text-align: left; }
.md h1,.md h2,.md h3 { color: var(--gold); }
.warn { color: var(--bad); font-weight: 700; }
.muted { color: var(--muted); }
.pre { white-space: pre-wrap; font-family: ui-monospace, Menlo, monospace; font-size: 12px; max-height: 320px; overflow: auto; background: #0e0d0b; padding: 8px; border-radius: 8px; }
.thumbs { display: grid; grid-template-columns: repeat(auto-fill, minmax(110px, 1fr)); gap: 8px; }
.thumbs figure { margin: 0; }
.thumbs img { width: 100%; height: 86px; object-fit: cover; border: 1px solid var(--line); border-radius: 6px; cursor: zoom-in; background: #000; }
.thumbs figcaption { font-size: 10px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
ul.inbox { list-style: none; padding: 0; margin: 0; }
ul.inbox li { display: flex; gap: 8px; align-items: flex-start; padding: 6px 0; border-bottom: 1px solid #2a261e; }
.cov { display: grid; grid-template-columns: 130px 1fr; gap: 12px; align-items: center; }
.legend { display: flex; gap: 10px; flex-wrap: wrap; color: var(--muted); font-size: 12px; }
.sw { display: inline-block; width: 9px; height: 9px; border-radius: 2px; margin-right: 4px; }
.lightbox { position: fixed; inset: 0; background: rgba(0,0,0,.82); display: none; place-items: center; z-index: 40; padding: 24px; }
.lightbox.on { display: grid; }
.lightbox img { max-width: min(92vw, 1200px); max-height: 86vh; border: 1px solid var(--gold); }
a { color: var(--gold2); }
@media (max-width: 1100px) {
  .row.metrics, .row.split, .steps { grid-template-columns: 1fr; }
  header.cmd { grid-template-columns: 1fr; }
}
</style>
</head>
<body>
<header class="cmd" id="statusbar"></header>
<main>
  <section class="panel focus" id="focusBox"></section>
  <div class="row metrics" id="metrics"></div>
  <section class="panel">
    <h2>MVP · 다음 게이트</h2>
    <div class="steps" id="steps"></div>
  </section>
  <div class="row split">
    <section class="panel">
      <h2>기획 커버리지</h2>
      <div class="cov">
        <div id="covRingWrap"></div>
        <div>
          <div id="covNums"></div>
          <div class="legend" id="covLegend"></div>
        </div>
      </div>
      <div class="md" id="stages"></div>
    </section>
    <section class="panel">
      <h2>INBOX 지시</h2>
      <div class="inbox-form">
        <textarea id="inboxText" placeholder="루프에 시킬 일을 적으세요"></textarea>
        <select id="inboxPri"><option value="normal">보통</option><option value="urgent">긴급</option></select>
        <button class="ok" id="inboxSend">보내기</button>
      </div>
      <p id="inboxAck" class="muted"></p>
      <h3 class="muted">미처리</h3>
      <ul class="inbox" id="inboxOpen"></ul>
      <h3 class="muted">처리됨</h3>
      <ul class="inbox" id="inboxDone"></ul>
    </section>
  </div>
  <section class="panel">
    <h2>작업 보드</h2>
    <div class="filters">
      <select id="fDiff"><option value="">난이도</option><option>하</option><option>중</option><option>상</option></select>
      <input id="fModel" type="text" placeholder="모델">
      <select id="fStatus"><option value="">상태</option><option>대기</option><option>진행 중</option><option>검증 중</option><option>완료</option><option>실패</option><option>막힘</option></select>
      <input id="fLoop" type="text" placeholder="최근 N바퀴">
    </div>
    <div class="kanban" id="kanban"></div>
  </section>
  <div class="row split">
    <section class="panel">
      <h2>바퀴 타임라인</h2>
      <div class="timeline" id="timeline"></div>
      <div class="bars" id="graph"></div>
      <pre class="pre" id="logView">바퀴 칸을 누르면 로그가 나옵니다.</pre>
    </section>
    <section class="panel">
      <h2>STATUS — 막힌 것 / 시스템</h2>
      <div class="md" id="statusHighlight"></div>
      <details><summary class="muted">STATUS.md 전체</summary><div class="md" id="statusAll"></div></details>
    </section>
  </div>
  <div class="row split">
    <section class="panel">
      <h2>최근 커밋</h2>
      <div id="commits"></div>
      <pre class="pre" id="commitView"></pre>
    </section>
    <section class="panel">
      <h2>라이브 로그</h2>
      <input id="logSearch" type="text" placeholder="검색">
      <pre class="pre" id="liveLog"></pre>
    </section>
  </div>
  <section class="panel">
    <h2>화면 · 에셋</h2>
    <div class="filters">
      <select id="aFilter">
        <option value="">전체</option>
        <option value="사용">사용 중</option>
        <option value="미사용">미사용</option>
        <option value="미확인">라이선스 미확인</option>
        <option value="생성">생성됨</option>
      </select>
    </div>
    <div class="md" id="assetsView"></div>
    <div class="thumbs" id="thumbs"></div>
  </section>
</main>
<div class="lightbox" id="lb"><img alt=""></div>
<script src="/board.js"></script>
</body>
</html>
