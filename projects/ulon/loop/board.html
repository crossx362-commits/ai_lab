<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ULON · 개발 현황 보드</title>
<style>
:root {
  --bg:#0b0a08; --panel:#17140f; --panel2:#1e1a14; --ink:#f3ead6; --muted:#9a8d74;
  --line:#3a3426; --gold:#d4af6a; --gold2:#f0d78a; --ok:#6fbf73; --ok2:#b6f0bc;
  --warn:#e0b04a; --bad:#d45b4a; --mid:#6aa8d8; --shadow:0 10px 40px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
html,body{margin:0;background:radial-gradient(1200px 500px at 10% -10%,#2a2214 0%,transparent 55%),radial-gradient(900px 400px at 100% 0%,#1a1410 0%,transparent 50%),var(--bg);color:var(--ink);font:13.5px/1.45 "Apple SD Gothic Neo","Noto Sans KR",sans-serif}
body{min-height:100vh}
header.cmd{position:sticky;top:0;z-index:20;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center;padding:10px 18px;background:rgba(11,10,8,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px}.sigil{width:36px;height:36px;border:1px solid var(--gold);border-radius:8px;display:grid;place-items:center;color:var(--gold);font-weight:800;letter-spacing:.08em;box-shadow:inset 0 0 12px rgba(212,175,106,.25)}
.brand h1{margin:0;font-size:15px;letter-spacing:.14em;color:var(--gold2)}.brand small{display:block;color:var(--muted);font-size:10px}.kpis{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.badge{padding:3px 9px;border-radius:999px;font-weight:700;font-size:11px}.b-run{background:#16351e;color:var(--ok2)}.b-wait{background:#3a3010;color:#f0d78a}.b-stop{background:#3a2018;color:#f0b0a4}.b-fail{background:#5a1818;color:#ffc0b8}.b-off{background:#2a2a2a;color:#bbb}
.pulse{width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok);animation:pulse 1.6s infinite}@keyframes pulse{50%{opacity:.35;transform:scale(.7)}}
button{cursor:pointer;background:#2a261e;color:var(--ink);border:1px solid var(--line);padding:7px 12px;border-radius:7px}button:disabled{opacity:.45;cursor:wait}button.danger{border-color:var(--bad);color:#f2c2ba}button.ok{border-color:var(--ok);color:var(--ok2)}
main{padding:16px;display:grid;gap:14px;max-width:1680px;margin:0 auto}.row{display:grid;gap:14px}.row.metrics{grid-template-columns:repeat(4,1fr)}.row.split{grid-template-columns:1.15fr .85fr}
section.panel{background:linear-gradient(180deg,var(--panel2),var(--panel));border:1px solid var(--line);border-radius:14px;padding:14px 16px;box-shadow:var(--shadow)}h2{margin:0 0 10px;font-size:12px;letter-spacing:.16em;color:var(--gold)}
.metric{min-height:88px;display:flex;flex-direction:column;justify-content:center}.metric b{font-size:25px}.metric span{color:var(--muted);font-size:12px}.metric .sub{margin-top:5px;color:#d9ccb0}.focus{border-color:#5a4a28;background:linear-gradient(90deg,rgba(212,175,106,.09),transparent 42%),var(--panel)}.focus p{margin:4px 0}.focus strong{color:var(--gold2)}
.steps{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.step{padding:10px;border-radius:10px;background:#15130f;border:1px solid var(--line);min-height:96px}.step.blocked{border-color:var(--bad)}.step.active{border-color:#8a5a18}.step .pri{font-weight:800;color:var(--gold)}.step .meta{font-size:11px;color:var(--muted);margin-top:5px}.empty{color:var(--muted);font-size:12px;padding:18px 6px;text-align:center}
.inbox-form{display:flex;gap:8px;flex-wrap:wrap}.inbox-form textarea{flex:1;min-width:220px;min-height:52px;background:#0e0d0b;color:var(--ink);border:1px solid var(--gold);border-radius:8px;padding:8px}.kanban{display:grid;grid-template-columns:repeat(6,minmax(155px,1fr));gap:8px;overflow-x:auto}.col{background:#12100c;border:1px solid var(--line);border-radius:10px;padding:8px;min-height:150px}.col.blocked{border-color:var(--bad)}.col h3{margin:0 0 8px;font-size:11px;color:var(--muted);display:flex;justify-content:space-between}.col h3 em{font-style:normal;color:var(--gold2)}.card{background:#221f18;border:1px solid var(--line);border-radius:8px;padding:8px;margin-bottom:8px}.d-하{border-left:4px solid #7dba8a}.d-중{border-left:4px solid var(--mid)}.d-상{border-left:4px solid #d47a3a}
.filters{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:8px}select,input[type=text]{background:#0e0d0b;color:var(--ink);border:1px solid var(--line);border-radius:6px;padding:5px 8px}.timeline{display:flex;gap:3px;flex-wrap:wrap;align-items:flex-end;min-height:36px}.tick{width:13px;height:28px;border-radius:3px;cursor:pointer}.t-ok{background:var(--ok)}.t-noc{background:var(--warn)}.t-fail{background:var(--bad)}.t-to{background:#6a6a6a}.bars{display:flex;align-items:flex-end;gap:2px;height:48px;margin-top:8px}
.md{overflow:auto;max-height:420px}.md table,table.grid{border-collapse:collapse;width:100%}.md th,.md td,table.grid th,table.grid td{border:1px solid var(--line);padding:5px 7px;text-align:left}.md h1,.md h2,.md h3{color:var(--gold)}.warn{color:var(--bad);font-weight:700}.muted{color:var(--muted)}.pre{white-space:pre-wrap;font-family:ui-monospace,Menlo,monospace;font-size:12px;max-height:320px;overflow:auto;background:#0e0d0b;padding:8px;border-radius:8px}.errorbox{display:none;border-color:var(--bad)!important;color:#ffd1ca}.errorbox.on{display:block}
.thumbs{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:8px}.thumbs figure{margin:0}.thumbs img{width:100%;height:86px;object-fit:cover;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;background:#000}.thumbs figcaption{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}ul.inbox{list-style:none;padding:0;margin:0}ul.inbox li{display:flex;gap:8px;align-items:flex-start;padding:6px 0;border-bottom:1px solid #2a261e}.cov{display:grid;grid-template-columns:130px 1fr;gap:12px;align-items:center}.coverage-box{width:110px;height:110px;border-radius:50%;display:grid;place-items:center;border:8px solid #2a261e;font-size:14px;text-align:center;color:var(--muted)}
.lightbox{position:fixed;inset:0;background:rgba(0,0,0,.82);display:none;place-items:center;z-index:40;padding:24px}.lightbox.on{display:grid}.lightbox img{max-width:min(92vw,1200px);max-height:86vh;border:1px solid var(--gold)}a{color:var(--gold2)}
@media(max-width:1100px){.row.metrics,.row.split,.steps{grid-template-columns:1fr}header.cmd{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(6,240px)}}
</style>
</head>
<body>
<header class="cmd" id="statusbar"></header>
<main id="dash">
  <section class="panel errorbox" id="errorBox"></section>
  <section class="panel focus" id="focusBox"></section>
  <div class="row metrics" id="metrics"></div>
  <section class="panel"><h2>다음 작업</h2><div class="steps" id="steps"></div></section>
  <div class="row split">
    <section class="panel">
      <h2>기획 커버리지</h2>
      <div class="cov"><div id="covRingWrap"></div><div><div id="covNums"></div><div class="muted" id="covLegend"></div></div></div>
      <div class="md" id="stages"></div>
    </section>
    <section class="panel">
      <h2>INBOX 지시</h2>
      <div class="inbox-form"><textarea id="inboxText" placeholder="루프에 시킬 일을 적으세요"></textarea><select id="inboxPri"><option value="normal">보통</option><option value="urgent">긴급</option></select><button class="ok" id="inboxSend">보내기</button></div>
      <p id="inboxAck" class="muted"></p><h3 class="muted">미처리</h3><ul class="inbox" id="inboxOpen"></ul><h3 class="muted">처리됨</h3><ul class="inbox" id="inboxDone"></ul>
    </section>
  </div>
  <section class="panel">
    <h2>작업 보드</h2>
    <div class="filters"><select id="fDiff"><option value="">난이도</option><option>하</option><option>중</option><option>상</option></select><input id="fModel" type="text" placeholder="모델"><select id="fStatus"><option value="">상태</option><option>대기</option><option>진행 중</option><option>검증 중</option><option>완료</option><option>실패</option><option>막힘</option></select><input id="fLoop" type="text" placeholder="최근 N바퀴"></div>
    <div class="kanban" id="kanban"></div>
  </section>
  <div class="row split">
    <section class="panel"><h2>바퀴 타임라인</h2><div class="timeline" id="timeline"></div><div class="bars" id="graph"></div><pre class="pre" id="logView">바퀴 칸을 누르면 로그가 나옵니다.</pre></section>
    <section class="panel"><h2>STATUS · 막힌 것 / 시스템</h2><div class="md" id="statusHighlight"></div><details><summary class="muted">STATUS.md 전체</summary><div class="md" id="statusAll"></div></details></section>
  </div>
  <div class="row split">
    <section class="panel"><h2>최근 커밋</h2><div id="commits"></div><pre class="pre" id="commitView"></pre></section>
    <section class="panel"><h2>라이브 로그</h2><input id="logSearch" type="text" placeholder="검색"><pre class="pre" id="liveLog"></pre></section>
  </div>
  <section class="panel"><h2>화면 · 에셋</h2><div class="filters"><select id="aFilter"><option value="">전체</option><option value="사용">사용 중</option><option value="미사용">미사용</option><option value="미확인">라이선스 미확인</option><option value="생성">생성됨</option></select></div><div class="md" id="assetsView"></div><div class="thumbs" id="thumbs"></div></section>
</main>
<div class="lightbox" id="lb"><img alt=""></div>
<script>
const COLS=["대기","진행 중","검증 중","완료","실패","막힘"];
let STATE=null, refreshing=false;
const $=id=>document.getElementById(id);
function esc(s){return String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;","\"":"&quot;","'":"&#39;"}[c]));}
function inline(s){return esc(s).replace(/\*\*(.+?)\*\*/g,"<strong>$1</strong>").replace(/`([^`]+)`/g,"<code>$1</code>");}
function md(src){if(!src)return"<p class='muted'>(파일 없음)</p>";const lines=src.replace(/\r/g,"").split("\n");let html="",inTable=false,inCode=false;for(const line of lines){if(line.startsWith("```")){inCode=!inCode;html+=inCode?"<pre class='pre'>":"</pre>";continue}if(inCode){html+=esc(line)+"\n";continue}if(line.startsWith("|")){if(!inTable){html+="<table>";inTable=true}const cells=line.split("|").slice(1,-1);if(cells.every(c=>/^[\s:-]+$/.test(c)))continue;const tag=html.endsWith("<table>")?"th":"td";html+="<tr>"+cells.map(c=>`<${tag}>${inline(c.trim())}</${tag}>`).join("")+"</tr>";continue}else if(inTable){html+="</table>";inTable=false}if(/^### /.test(line))html+=`<h3>${inline(line.slice(4))}</h3>`;else if(/^## /.test(line))html+=`<h2>${inline(line.slice(3))}</h2>`;else if(/^# /.test(line))html+=`<h1>${inline(line.slice(2))}</h1>`;else if(/^[-*] /.test(line))html+=`<li>${inline(line.slice(2))}</li>`;else if(!line.trim())html+="<br>";else html+=`<p>${inline(line)}</p>`}if(inTable)html+="</table>";return html}
function badge(st){const map={running:["b-run","실행 중"],waiting:["b-wait","대기 중"],stopped_stop:["b-stop","STOP으로 정지"],stopped_fail:["b-fail","실패로 정지"]};const [cls,label]=map[st]||["b-off","상태 미확인"];return `<span class="badge ${cls}">${label}</span>`}
function elapsed(iso){if(!iso)return"—";const t=Date.parse(iso);if(!Number.isFinite(t))return esc(iso);const s=Math.max(0,Math.floor((Date.now()-t)/1000)),m=Math.floor(s/60),h=Math.floor(m/60);if(h)return`${h}시간 ${m%60}분`;if(m)return`${m}분 ${s%60}초`;return`${s}초`}
function showError(msg){const el=$("errorBox");el.textContent=msg||"";el.classList.toggle("on",!!msg)}
async function api(path,opt){const r=await fetch(path,opt);if(!r.ok){let t="";try{t=await r.text()}catch{}throw new Error(`${path} · HTTP ${r.status}${t?` · ${t.slice(0,160)}`:""}`)}const ct=r.headers.get("content-type")||"";return ct.includes("json")?r.json():r.text()}
function extractSection(src,key){if(!src)return"";const lines=src.split("\n");let start=-1;for(let i=0;i<lines.length;i++){if(lines[i].includes(key)&&/^#{1,3} /.test(lines[i])){start=i;break}}if(start<0)return"";let end=lines.length;const level=(lines[start].match(/^#+/)||["#"])[0].length;for(let i=start+1;i<lines.length;i++){const m=lines[i].match(/^(#{1,3}) /);if(m&&m[1].length<=level){end=i;break}}return md(lines.slice(start,end).join("\n"))}
function stats(){const history=STATE.history||[],cards=STATE.board?.cards||[],inbox=STATE.inbox||[];const success=history.filter(x=>x.result==="success").length,fail=history.filter(x=>x.result==="fail"||x.result==="timeout").length;return{history,cards,inbox,success,fail,successPct:history.length?Math.round(success/history.length*100):null,openInbox:inbox.filter(x=>!x.done).length,active:cards.filter(x=>["진행 중","검증 중"].includes(x.status)).length,blocked:cards.filter(x=>x.status==="막힘").length,done:cards.filter(x=>x.status==="완료").length}}
function renderHeader(){const ls=STATE.loop_state||{},today=ls.today||{},w=STATE.warnings||{},live=ls.status==="running",wait=ls.status==="waiting"?` · 다음 ${ls.wait_remaining_sec??0}초`:"";$("statusbar").innerHTML=`<div class="brand"><div class="sigil">UO</div><div><h1>ULON COMMAND</h1><small>${esc(location.host)} · #dash</small></div></div><div class="kpis">${live?'<span class="pulse"></span>':""}${badge(ls.status)}<strong>바퀴 #${ls.loop??"—"}</strong><span class="muted">경과 ${elapsed(ls.started_at)}</span><span>${esc(ls.current_task||"대기")}${wait}</span><span class="muted">오늘 ${today.loops||0} · 성공 ${today.success||0} · 실패 ${today.fail||0} · 커밋 ${today.commits||0}</span><span class="warn">막힘 ${w.blocked||0} · 라이선스? ${w.license_unknown||0} · 무커밋 ${w.no_commit_streak||0}</span><span class="muted">갱신 ${new Date().toLocaleTimeString("ko-KR")}</span></div><div>${STATE.stop?'<button class="ok" id="btnGo">정지 해제</button>':'<button class="danger" id="btnStop">정지</button>'}</div>`;const stop=$("btnStop"),go=$("btnGo");if(stop)stop.onclick=async()=>{if(!confirm("현재 바퀴를 마친 뒤 멈춥니다. STOP 파일을 만들까요?"))return;stop.disabled=true;try{await api("/api/stop",{method:"POST",headers:{"Content-Type":"application/json"},body:"{}"});await refresh()}catch(e){showError(e.message)}finally{stop.disabled=false}};if(go)go.onclick=async()=>{go.disabled=true;try{await api("/api/stop",{method:"DELETE"});await refresh()}catch(e){showError(e.message)}finally{go.disabled=false}}}
function renderFocus(){const s=stats(),ls=STATE.loop_state||{};let title="현재 루프 대기",detail="실행 중인 작업이 없습니다.";if(ls.current_task){title=ls.current_task;detail=`바퀴 #${ls.loop??"—"} · 상태 ${ls.status||"미확인"}`}else{const urgent=s.inbox.find(x=>!x.done&&x.urgent),active=s.cards.find(x=>["진행 중","검증 중","막힘"].includes(x.status));if(urgent){title="긴급 INBOX 대기";detail=urgent.text}else if(active){title=active.title||"활성 작업";detail=`${active.status||""} · ${active.model||"모델 미기록"}`}}$("focusBox").innerHTML=`<h2>지금 가장 중요한 것</h2><p><strong>${esc(title)}</strong></p><p class="muted">${esc(detail)}</p>`}
function renderMetrics(){const s=stats(),ls=STATE.loop_state||{},items=[{v:ls.loop??"—",t:"현재 바퀴",sub:ls.status||"상태 미확인"},{v:s.successPct==null?"—":`${s.successPct}%`,t:"최근 성공률",sub:`${s.history.length}바퀴 · 성공 ${s.success} · 실패/시간초과 ${s.fail}`},{v:s.openInbox,t:"미처리 지시",sub:`긴급 ${s.inbox.filter(x=>!x.done&&x.urgent).length}`},{v:s.active+s.blocked,t:"활성/막힘 작업",sub:`진행·검증 ${s.active} · 막힘 ${s.blocked} · 완료 ${s.done}`}];$("metrics").innerHTML=items.map(x=>`<section class="panel metric"><span>${esc(x.t)}</span><b>${esc(x.v)}</b><div class="sub">${esc(x.sub)}</div></section>`).join("")}
function renderSteps(){const s=stats();const rank={"막힘":0,"진행 중":1,"검증 중":2,"실패":3,"대기":4,"완료":9};const cards=[...s.cards].filter(c=>c.status!=="완료").sort((a,b)=>(rank[a.status]??5)-(rank[b.status]??5)).slice(0,5);if(!cards.length){$("steps").innerHTML='<div class="empty">board.json에 다음 작업 카드가 없습니다. 없는 작업을 추정해서 만들지 않습니다.</div>';return}$("steps").innerHTML=cards.map(c=>`<div class="step ${c.status==="막힘"?"blocked":"active"}"><div class="pri">${esc(c.status||"대기")}</div><strong>${esc(c.title||"제목 없음")}</strong><div class="meta">${esc(c.difficulty||"난이도 미기록")} · ${esc(c.model||"모델 미기록")}</div><div class="meta">${esc(c.rationale||"")}</div></div>`).join("")}
function renderCoverage(){const c=STATE.coverage;if(c&&Number.isFinite(Number(c.total))){const score=Number(c.score)||0;$("covRingWrap").innerHTML=`<div class="coverage-box"><strong>${Math.round(score)}%</strong></div>`;$("covNums").innerHTML=`<strong>${esc(c.counts?.full||0)} 구현</strong> / ${esc(c.total)}항`;$("covLegend").textContent=`일부 ${c.counts?.partial||0} · 없음 ${c.counts?.missing||0}`;$("stages").innerHTML=md(STATE.stages_md||"")}else{$("covRingWrap").innerHTML='<div class="coverage-box">데이터<br>미연결</div>';$("covNums").innerHTML='<strong>기획 커버리지 값 없음</strong>';$("covLegend").textContent="현재 /api/state에 커버리지 구조가 없어 숫자를 추정하지 않습니다.";$("stages").innerHTML='<p class="muted">DESIGN_COVERAGE.md 집계 API가 연결되면 이 영역에 단계별 수치를 표시할 수 있습니다.</p>'}}
function renderInbox(){const open=$("inboxOpen"),done=$("inboxDone");open.innerHTML="";done.innerHTML="";for(const it of STATE.inbox||[]){const li=document.createElement("li");if(it.done){li.innerHTML=`<span>[완료] 바퀴#${esc(it.loop??"—")} ${esc(it.text)}</span>`;done.appendChild(li)}else{li.innerHTML=`<span>${it.urgent?"[긴급] ":""}${esc(it.ts)} ${esc(it.text)}</span><button data-i="${it.index}" class="edit">수정</button><button data-i="${it.index}" class="del">삭제</button>`;open.appendChild(li)}}if(!open.children.length)open.innerHTML='<li class="muted">미처리 지시 없음</li>';if(!done.children.length)done.innerHTML='<li class="muted">처리 기록 없음</li>';open.querySelectorAll(".del").forEach(b=>b.onclick=async()=>{try{await api("/api/inbox?index="+b.dataset.i,{method:"DELETE"});await refresh()}catch(e){showError(e.message)}});open.querySelectorAll(".edit").forEach(b=>b.onclick=async()=>{const it=(STATE.inbox||[]).find(x=>String(x.index)===b.dataset.i),text=prompt("수정",it?.text||"");if(text==null)return;try{await api("/api/inbox",{method:"PATCH",headers:{"Content-Type":"application/json"},body:JSON.stringify({index:Number(b.dataset.i),text})});await refresh()}catch(e){showError(e.message)}})}
function passCard(c){const d=$("fDiff").value,m=$("fModel").value.trim(),st=$("fStatus").value,n=parseInt($("fLoop").value,10);if(d&&c.difficulty!==d)return false;if(m&&!(c.model||"").includes(m))return false;if(st&&c.status!==st)return false;if(Number.isFinite(n)&&n>0){const cur=STATE.loop_state?.loop||0,al=c.assigned_loop??0;if(al<cur-n+1)return false}return true}
function renderKanban(){const box=$("kanban"),cards=STATE.board?.cards||[];box.innerHTML="";for(const col of COLS){const list=cards.filter(x=>x.status===col&&passCard(x)),div=document.createElement("div");div.className="col"+(col==="막힘"?" blocked":"");div.innerHTML=`<h3><span>${col}</span><em>${list.length}</em></h3>`;for(const c of list){const el=document.createElement("div");el.className="card d-"+(c.difficulty||"중");el.innerHTML=`<strong>${esc(c.title||"제목 없음")}</strong><div class="muted">${esc(c.difficulty||"-")} · ${esc(c.model||"모델 미기록")}</div><div class="muted">배정 #${esc(c.assigned_loop??"—")} · 완료 #${esc(c.completed_loop??"—")}</div>${c.commit?`<a href="#dash" data-h="${esc(c.commit)}">${esc(String(c.commit).slice(0,8))}</a>`:""}<div class="muted">${esc(c.rationale||"")}</div><button class="reply">INBOX에 답하기</button>`;el.querySelector(".reply").onclick=()=>{$("inboxText").value=`[${c.title||"작업"}] `;$("inboxText").focus()};const a=el.querySelector("a");if(a)a.onclick=e=>{e.preventDefault();showCommit(a.dataset.h)};div.appendChild(el)}if(!list.length)div.innerHTML+='<div class="empty">없음</div>';box.appendChild(div)}}
function renderTimeline(){const hist=STATE.history||[],commits=new Set((STATE.commits||[]).map(c=>c.loop)),box=$("timeline"),bars=$("graph");box.innerHTML="";const secs=[];for(const row of hist){const t=document.createElement("div");let cls="t-ok";if(row.result==="timeout")cls="t-to";else if(row.result==="fail")cls="t-fail";else if(row.result==="success"&&!commits.has(row.loop))cls="t-noc";t.className="tick "+cls;t.title=`#${row.loop} ${row.result} ${row.elapsed_sec||0}s`;t.onclick=()=>showLog(row.loop);box.appendChild(t);secs.push(Number(row.elapsed_sec)||0)}if(!hist.length)box.innerHTML='<span class="muted">바퀴 기록 없음</span>';const max=Math.max(1,...secs);bars.innerHTML=secs.map(s=>`<span title="${s}s" style="width:8px;height:${Math.max(4,Math.round(42*s/max))}px;background:#d4af6a;border-radius:2px"></span>`).join("")}
async function showLog(n){try{const j=await api("/api/log/"+n);$("logView").textContent=j.text||"(로그 없음)"}catch(e){showError(e.message)}}
function renderStatus(){const st=STATE.status_md||"",blocked=extractSection(st,"막힌"),sys=extractSection(st,"시스템 상태");$("statusHighlight").innerHTML=(blocked||"")+(sys||(!blocked?"<p class='muted'>강조할 막힘/시스템 절이 없습니다.</p>":""));$("statusAll").innerHTML=md(st)}
function renderCommits(){const list=STATE.commits||[],box=$("commits");if(!list.length){box.innerHTML='<p class="muted">최근 커밋 없음</p>';return}box.innerHTML='<table class="grid"><tr><th>바퀴</th><th>메시지</th><th>파일</th><th>시각</th></tr>'+list.slice(0,20).map(c=>`<tr><td>${c.loop??"—"}</td><td><a href="#dash" data-h="${esc(c.hash)}">${esc(c.message)}</a></td><td>${esc(c.files)}</td><td>${esc(c.date)}</td></tr>`).join("")+"</table>";box.querySelectorAll("a").forEach(a=>a.onclick=e=>{e.preventDefault();showCommit(a.dataset.h)})}
async function showCommit(h){try{const j=await api("/api/commit/"+h);$("commitView").textContent=(j.stat||"")+"\n"+(j.diff||j.error||"")}catch(e){showError(e.message)}}
function renderAssets(){const f=$("aFilter").value;let src=STATE.assets_md||"";if(f)src=src.split("\n").filter(l=>!l.startsWith("|")||l.includes(f)||/경로|---/.test(l)).join("\n");$("assetsView").innerHTML=md(src);const box=$("thumbs");box.innerHTML="";for(const p of STATE.previews||[]){const fig=document.createElement("figure"),img=document.createElement("img");img.src="/api/file?path="+encodeURIComponent(p.path);img.alt=p.name;img.onclick=()=>{$("lb").querySelector("img").src=img.src;$("lb").classList.add("on")};fig.appendChild(img);const cap=document.createElement("figcaption");cap.textContent=p.name;fig.appendChild(cap);box.appendChild(fig)}if(!box.children.length)box.innerHTML='<p class="muted">미리보기 이미지 없음</p>'}
async function loadLive(){const n=STATE?.loop_state?.loop;if(n==null){$("liveLog").textContent="(루프 상태 없음)";return}try{const j=await api("/api/log/"+n);let text=j.text||"",q=$("logSearch").value.trim();if(q)text=text.split("\n").filter(l=>l.includes(q)).join("\n");const el=$("liveLog"),stick=el.scrollTop+el.clientHeight>=el.scrollHeight-20;el.textContent=text||"(로그 없음)";if(stick)el.scrollTop=el.scrollHeight}catch(e){$("liveLog").textContent="로그 읽기 실패: "+e.message}}
function render(){renderHeader();renderFocus();renderMetrics();renderSteps();renderCoverage();renderInbox();renderKanban();renderTimeline();renderStatus();renderCommits();renderAssets();loadLive()}
async function refresh(){if(refreshing)return;refreshing=true;try{STATE=await api("/api/state");showError("");render()}catch(e){showError("보드 데이터 갱신 실패: "+e.message)}finally{refreshing=false}}
$("inboxSend").onclick=async()=>{const text=$("inboxText").value.trim(),urgent=$("inboxPri").value==="urgent";if(!text)return;const btn=$("inboxSend");btn.disabled=true;try{const j=await api("/api/inbox",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({text,urgent})});$("inboxAck").textContent=j.ok?"파일 기록 확인: "+j.line:"기록 실패";if(j.ok)$("inboxText").value="";await refresh()}catch(e){$("inboxAck").textContent="기록 실패: "+e.message}finally{btn.disabled=false}};
["fDiff","fModel","fStatus","fLoop","aFilter"].forEach(id=>{$(id).addEventListener("input",()=>{if(STATE){renderKanban();renderAssets()}});$(id).addEventListener("change",()=>{if(STATE){renderKanban();renderAssets()}})});$("logSearch").addEventListener("input",()=>{if(STATE)loadLive()});$("lb").onclick=()=>$("lb").classList.remove("on");if(!location.hash)history.replaceState(null,"","#dash");refresh();setInterval(refresh,3000);
</script>
</body>
</html>
