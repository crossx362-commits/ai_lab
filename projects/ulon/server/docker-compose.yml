services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: ulon
      POSTGRES_USER: ulon
      POSTGRES_PASSWORD: ulon
    ports:
      - "5432:5432"
    volumes:
      - ulon-pg:/var/lib/postgresql/data
      - ./schema.sql:/docker-entrypoint-initdb.d/01-schema.sql
volumes:
  ulon-pg:
