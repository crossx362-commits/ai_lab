<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoDev v2</title>
<style>
:root{color-scheme:dark;--bg:#090d12;--panel:#121922;--panel2:#18222e;--line:#293746;--text:#eef3f8;--muted:#91a0b2;--good:#45d69d;--warn:#ffc85d;--bad:#ff7180;--blue:#72a8ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:15px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{max-width:1300px;margin:auto;padding:18px}.top{display:flex;align-items:center;justify-content:space-between;gap:12px}.brand b{font-size:23px}.brand div{margin-top:4px;color:var(--muted);font-size:13px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:10px 14px;border-radius:10px;font-weight:800;cursor:pointer}button:disabled{opacity:.35;cursor:not-allowed}.primary{background:#2464ee;border-color:#2464ee}.danger{background:#4b222a;border-color:#71313d}.repair{background:#553d13;border-color:#88641e}.card{background:var(--panel);border:1px solid var(--line);border-radius:15px}.hero{margin-top:14px;padding:20px;display:grid;grid-template-columns:auto 1fr auto;gap:16px;align-items:center}.lamp{font-size:42px}.heroTitle{font-size:26px;font-weight:900}.heroStage{font-size:17px;margin-top:5px}.heartbeat{color:var(--muted);font-size:13px;margin-top:7px}.stamp{color:var(--muted);font-size:12px;text-align:right}.grid{display:grid;grid-template-columns:1.1fr .9fr;gap:14px;margin-top:14px}.section{padding:17px}.section h2{font-size:16px;margin:0 0 13px}.taskTitle{font-size:21px;font-weight:900}.taskDesc{margin-top:8px;color:#c8d2dd;line-height:1.5;white-space:pre-wrap}.minirow{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:14px}.mini{background:#0d141c;border:1px solid var(--line);border-radius:11px;padding:12px}.mini span{color:var(--muted);font-size:12px}.mini b{display:block;font-size:24px;margin-top:4px}.fuel{display:grid;gap:11px}.fuelbox{background:#0d141c;border:1px solid var(--line);border-radius:11px;padding:12px}.fuelhead{display:flex;align-items:end;justify-content:space-between;gap:10px}.fuelname{font-weight:900}.fuelnum{font-size:20px;font-weight:900}.bar{height:15px;background:#222d39;border-radius:999px;overflow:hidden;margin-top:8px}.fill{height:100%;border-radius:999px}.good{background:var(--good)}.warn{background:var(--warn)}.bad{background:var(--bad)}.fuelnote{color:var(--muted);font-size:12px;margin-top:6px}.goodText{color:var(--good)}.warnText{color:var(--warn)}.badText{color:var(--bad)}.problem{margin-top:14px;padding:17px;background:#0f1814;border-color:#295744}.problem.warn{background:#1b160c;border-color:#6a5624}.problem.bad{background:#1a1014;border-color:#67323c}.problemTitle{font-size:18px;font-weight:900}.problemLead{margin-top:6px;color:#c8d2dd}.problemList{display:grid;gap:8px;margin-top:11px}.problemItem{padding:11px;background:#101820;border:1px solid var(--line);border-radius:9px}.problemItem b{display:block}.problemItem div{margin-top:5px;color:#d4dde6;white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.45}details{margin-top:14px}.detailsBox{background:#0d141c;border:1px solid var(--line);border-radius:11px;padding:13px}.detailsGrid{display:grid;grid-template-columns:repeat(5,1fr);gap:8px}.detail{background:#101923;border-radius:8px;padding:9px}.detail span{display:block;color:var(--muted);font-size:11px}.detail b{display:block;margin-top:3px;word-break:break-all}.log{height:320px;overflow:auto;background:#070b10;border-radius:9px;margin-top:10px;padding:10px;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;white-space:pre-wrap}.log .err{color:#ffa3ad}.log .time{color:#586a7d;margin-right:8px}.smallActions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}@media(max-width:850px){.top,.hero{display:grid;grid-template-columns:1fr}.stamp{text-align:left}.grid{grid-template-columns:1fr}.detailsGrid{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand"><b>AutoDev v2</b><div>재와별을 알아서 개발하고, 고치고, 검사하는 작업대</div></div>
    <div class="actions">
      <button id="updateBtn" onclick="doUpdate()">🔄 전체 업데이트</button>
      <button id="repairBtn" class="repair" onclick="recover()" hidden>🩹 자동 복구</button>
      <button id="stopBtn" class="danger" onclick="doStop()">■ 멈추기</button>
      <button id="startBtn" class="primary" onclick="doStart()">▶ 개발 시작</button>
    </div>
  </div>

  <section class="card hero">
    <div id="lamp" class="lamp">⚪</div>
    <div><div id="heroTitle" class="heroTitle">상태 확인 중</div><div id="heroStage" class="heroStage">잠시만 기다려 주세요.</div><div id="heartbeat" class="heartbeat">심박 확인 중</div></div>
    <div id="refreshAt" class="stamp">마지막 확인 -</div>
  </section>

  <div class="grid">
    <section class="card section">
      <h2>🛠️ 지금 하는 일</h2>
      <div id="taskTitle" class="taskTitle">작업 확인 중</div>
      <div id="taskDesc" class="taskDesc">AutoDev가 현재 작업을 읽고 있습니다.</div>
      <div class="minirow">
        <div class="mini"><span>앞으로 할 일</span><b id="queue">0</b></div>
        <div class="mini"><span>끝낸 일</span><b id="done" class="goodText">0</b></div>
        <div class="mini"><span>막힌 일</span><b id="blocked">0</b></div>
      </div>
    </section>

    <section class="card section">
      <h2>🔋 AI 연료</h2>
      <div id="codexFuel" class="fuel"></div>
      <div id="grokFuel" class="fuel" style="margin-top:11px"></div>
    </section>
  </div>

  <section id="problem" class="card problem">
    <div id="problemTitle" class="problemTitle goodText">✅ 지금은 큰 문제 없음</div>
    <div id="problemLead" class="problemLead">AutoDev가 계속 진행할 수 있습니다.</div>
    <div id="problemList" class="problemList"></div>
  </section>

  <details>
    <summary>🔎 자세한 개발 정보 보기</summary>
    <div class="detailsBox">
      <div class="detailsGrid">
        <div class="detail"><span>엔진 PID</span><b id="pid">-</b></div>
        <div class="detail"><span>실행 코드</span><b id="engineHead">-</b></div>
        <div class="detail"><span>현재 코드</span><b id="git">-</b></div>
        <div class="detail"><span>Grok 호출</span><b id="grokCalls">0</b></div>
        <div class="detail"><span>Codex 호출</span><b id="codexCalls">0</b></div>
      </div>
      <div class="smallActions"><button onclick="post('/api/open-repo')">프로젝트 폴더 열기</button><button onclick="clearLogs()">로그 비우기</button><button onclick="post('/api/quota/codex/clear')">Codex 한도 다시 확인</button></div>
      <div id="log" class="log"></div>
    </div>
  </details>
</div>
<script>
const qs=new URLSearchParams(location.search),token=qs.get('token')||'';let lastSeq=0,busy=false,current=null;
const $=x=>document.getElementById(x);
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function pctClass(p){return p>50?'good':p>20?'warn':'bad'}
function fmt(ts){if(!ts)return '알 수 없음';try{return new Date(ts*1000).toLocaleString('ko-KR',{month:'numeric',day:'numeric',hour:'2-digit',minute:'2-digit'})}catch(e){return '알 수 없음'}}
function quiet(sec){if(sec==null)return '실제 출력 기록이 아직 없습니다.';if(sec<8)return '방금 실제 움직임이 있었습니다.';if(sec<60)return `${sec}초 전에 실제 출력이 있었습니다.`;return `${Math.floor(sec/60)}분째 AI의 새 출력은 없지만 심박을 따로 확인합니다.`}
async function req(path,opt={}){const sep=path.includes('?')?'&':'?';const r=await fetch(path+sep+'token='+encodeURIComponent(token),{cache:'no-store',headers:{'X-AutoDev-Token':token,...(opt.headers||{})},...opt});const d=await r.json();if(!r.ok||d.ok===false)throw new Error(d.message||('HTTP '+r.status));return d}
async function post(path){return req(path,{method:'POST'})}
function controls(){const run=!!current?.running,broken=!!(current?.engine?.stale||current?.engine?.duplicate||(run&&current?.heartbeat_age!=null&&current.heartbeat_age>20));$('startBtn').disabled=busy||run;$('stopBtn').disabled=busy||!run;$('updateBtn').disabled=busy;$('repairBtn').hidden=!broken;$('repairBtn').disabled=busy}
async function doStart(){if(busy)return;busy=true;controls();try{await post('/api/start');await wait(700);await refresh()}catch(e){alert(e.message||e)}finally{busy=false;controls()}}
async function doStop(){if(busy)return;busy=true;controls();try{await post('/api/stop');await wait(500);await refresh()}catch(e){alert(e.message||e)}finally{busy=false;controls()}}
async function recover(){if(busy)return;busy=true;controls();$('repairBtn').textContent='🛠️ 복구 중';try{if(current?.running)await post('/api/stop');await wait(500);await post('/api/start');await wait(900);await refresh()}catch(e){alert(e.message||e)}finally{busy=false;$('repairBtn').textContent='🩹 자동 복구';controls()}}
async function doUpdate(){if(busy)return;busy=true;controls();$('updateBtn').textContent='⏳ 업데이트 중';try{const d=await post('/api/update');if(d.restarting){setTimeout(waitRestart,800);return}await refresh()}catch(e){alert(e.message||e);busy=false;$('updateBtn').textContent='🔄 전체 업데이트';controls()}}
async function waitRestart(){for(let i=0;i<60;i++){try{const r=await fetch('/',{cache:'no-store'});if(r.ok){location.href='/';return}}catch(e){}await wait(400)}busy=false;$('updateBtn').textContent='🔄 전체 업데이트';controls();alert('새 화면이 아직 안 떴습니다. 브라우저 새로고침을 한 번 해주세요.')}
function wait(ms){return new Promise(r=>setTimeout(r,ms))}
function renderCodex(s){const box=$('codexFuel'),u=s.codex_usage||{},q=s.codex_quota||{},cli=s.codex_cli||{};if(!cli.installed){box.innerHTML='<div class="fuelbox"><div class="fuelhead"><div class="fuelname">Codex</div><div class="fuelnum badText">없음</div></div><div class="fuelnote">CLI를 찾지 못했습니다.</div></div>';return}if(q.active){box.innerHTML=`<div class="fuelbox"><div class="fuelhead"><div class="fuelname">Codex</div><div class="fuelnum warnText">잠깐 쉬는 중</div></div><div class="fuelnote">약 ${Math.ceil((q.remaining_seconds||0)/60)}분 뒤 실제로 다시 확인합니다.</div></div>`;return}if(!u.ok||!(u.windows||[]).length){box.innerHTML='<div class="fuelbox"><div class="fuelhead"><div class="fuelname">Codex</div><div class="fuelnum goodText">사용 가능</div></div><div class="fuelnote">남은 %를 아직 못 읽었습니다.</div></div>';return}box.innerHTML='';for(const w of u.windows){const p=Math.max(0,Math.min(100,Number(w.remaining_percent)||0)),cl=pctClass(p);box.insertAdjacentHTML('beforeend',`<div class="fuelbox"><div class="fuelhead"><div class="fuelname">Codex ${esc(w.name)}</div><div class="fuelnum ${cl}Text">${p}% 남음</div></div><div class="bar"><div class="fill ${cl}" style="width:${p}%"></div></div><div class="fuelnote">${w.resets_at?'다시 채워지는 시간 '+fmt(w.resets_at):'리셋 시간 정보 없음'}</div></div>`)}}
function renderGrok(s){const box=$('grokFuel'),q=s.grok_quota||{},cli=s.grok_cli||{};if(!cli.installed){box.innerHTML='<div class="fuelbox"><div class="fuelhead"><div class="fuelname">Grok</div><div class="fuelnum badText">없음</div></div><div class="fuelnote">CLI를 찾지 못했습니다.</div></div>';return}if(q.active){box.innerHTML=`<div class="fuelbox"><div class="fuelhead"><div class="fuelname">Grok</div><div class="fuelnum warnText">한도 대기</div></div><div class="fuelnote">약 ${Math.ceil((q.remaining_seconds||0)/60)}분 뒤 다시 확인합니다.</div></div>`}else{box.innerHTML='<div class="fuelbox"><div class="fuelhead"><div class="fuelname">Grok</div><div class="fuelnum goodText">사용 가능</div></div><div class="fuelnote">정확한 잔량 %는 제공되지 않아 가짜 숫자는 표시하지 않습니다.</div></div>'}}
function renderProblems(s,broken){const p=$('problem'),t=$('problemTitle'),lead=$('problemLead'),list=$('problemList');list.innerHTML='';if(broken){p.className='card problem bad';t.className='problemTitle badText';t.textContent='🩹 자동 복구가 필요한 상태';lead.textContent='구버전·중복·심박 끊김 중 하나가 감지됐습니다. 위의 자동 복구 버튼 한 번이면 됩니다.'}else if(s.issue_count){p.className='card problem warn';t.className='problemTitle warnText';t.textContent=`⚠️ 확인할 문제 ${s.issue_count}개`;lead.textContent='막힌 작업은 건너뛰고 가능한 작업은 계속 진행합니다.'}else{p.className='card problem';t.className='problemTitle goodText';t.textContent='✅ 지금은 큰 문제 없음';lead.textContent=s.running?'AutoDev가 계속 개발 중입니다.':'개발 시작을 누르면 이어서 진행합니다.'}for(const x of s.blocked_items||[]){list.insertAdjacentHTML('beforeend',`<div class="problemItem"><b>막힌 일: ${esc(x.title)}</b><div>${esc(x.reason)}</div></div>`)}for(const x of (s.recent_errors||[]).slice(-6)){list.insertAdjacentHTML('beforeend',`<div class="problemItem"><b>${esc(x.time)}</b><div>${esc(x.text)}</div></div>`)}}
async function refresh(){try{const s=await req('/api/status');current=s;const run=!!s.running,stale=!!s.engine?.stale,dup=!!s.engine?.duplicate,hung=run&&s.heartbeat_age!=null&&s.heartbeat_age>20,broken=stale||dup||hung;$('refreshAt').textContent='마지막 확인 '+new Date((s.checked_at||Date.now()/1000)*1000).toLocaleTimeString('ko-KR');if(broken){$('lamp').textContent='🔴';$('heroTitle').textContent=stale?'구버전 엔진이 돌고 있습니다':dup?'엔진이 여러 개 떠 있습니다':'엔진 심박이 끊겼습니다';$('heroTitle').className='heroTitle badText';$('heroStage').textContent='자동 복구 버튼으로 한 번에 정리할 수 있습니다.'}else if(run){$('lamp').textContent=s.quiet_seconds>120?'🟡':'🟢';$('heroTitle').textContent=s.quiet_seconds>120?'AI가 오래 생각 중입니다':'잘 돌아가는 중';$('heroTitle').className='heroTitle '+(s.quiet_seconds>120?'warnText':'goodText');$('heroStage').textContent=s.stage||'개발 중'}else{$('lamp').textContent='⚪';$('heroTitle').textContent='지금은 쉬는 중';$('heroTitle').className='heroTitle';$('heroStage').textContent='개발 시작을 누르면 이어서 진행합니다.'}$('heartbeat').textContent=(run?`심박 ${s.heartbeat_age==null?'없음':s.heartbeat_age+'초 전'} · `:'')+quiet(s.quiet_seconds);const c=s.current||{};$('taskTitle').textContent=c.title||c.id||(run?'다음 작업 고르는 중':'현재 작업 없음');$('taskDesc').textContent=c.goal||c.description||s.goal||'표시할 작업 설명이 없습니다.';$('queue').textContent=s.queue_count??0;$('done').textContent=s.completed_count??0;$('blocked').textContent=s.blocked_count??0;$('blocked').className=s.blocked_count?'badText':'goodText';$('pid').textContent=(s.engine?.pids||[]).join(', ')||'-';$('engineHead').textContent=s.engine?.repo_head||'-';$('git').textContent=`${s.git?.branch||'?'} @ ${s.git?.head||'?'} · 변경 ${s.git?.dirty_count??'?'}개`;const st=s.stats||{};$('grokCalls').textContent=st.grok_calls||0;$('codexCalls').textContent=st.codex_calls||0;renderCodex(s);renderGrok(s);renderProblems(s,broken);controls()}catch(e){$('lamp').textContent='🔴';$('heroTitle').textContent='대시보드 연결 문제';$('heroTitle').className='heroTitle badText';$('heroStage').textContent=e.message||String(e)}}
async function logs(){try{const d=await req('/api/logs?after='+lastSeq),box=$('log');let html='';for(const x of d.rows||[]){const er=/(error|exception|failed|timeout|blocked|402|실패|오류|막힘)/i.test(x.text||'');html+=`<div class="${er?'err':''}"><span class="time">${esc(x.time)}</span>${esc(x.text)}</div>`}if(html){const near=box.scrollTop+box.clientHeight>box.scrollHeight-70;box.insertAdjacentHTML('beforeend',html);if(near)box.scrollTop=box.scrollHeight}lastSeq=d.last_seq||lastSeq}catch(e){}}
async function clearLogs(){await post('/api/clear-logs');$('log').innerHTML='';lastSeq=0}
refresh();logs();setInterval(refresh,1500);setInterval(logs,700);
</script>
</body>
</html>
