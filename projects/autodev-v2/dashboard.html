<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoDev v2</title>
<style>
:root{color-scheme:dark;--bg:#090d12;--panel:#121820;--panel2:#18212b;--line:#273340;--text:#e9eef5;--muted:#8d9bad;--good:#41d89b;--bad:#ff6b78;--warn:#ffc85a;--accent:#72a7ff}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{min-height:68px;padding:10px 20px;display:flex;align-items:center;justify-content:space-between;gap:12px;border-bottom:1px solid var(--line);background:#0d131a;position:sticky;top:0;z-index:3}.title{font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}button:hover:not(:disabled){border-color:#51667c}button:disabled{opacity:.38;cursor:not-allowed}.primary{background:#215ff1;border-color:#215ff1}.danger{background:#4b1f28;border-color:#7b3441}.warnbtn{background:#4c3c12;border-color:#806a25}main{padding:16px;display:grid;gap:14px}.cards{display:grid;grid-template-columns:repeat(7,minmax(110px,1fr));gap:10px}.card,.panel{border:1px solid var(--line);background:var(--panel);border-radius:12px}.card{padding:13px;min-height:84px}.k{font-size:11px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}.v{font-size:19px;font-weight:800;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1.5fr;gap:14px}.panel h3{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}.body{padding:14px}.goal{font-size:15px;line-height:1.45}.task{margin-top:12px;padding:12px;border:1px solid var(--line);background:#0d131a;border-radius:10px}.taskid{color:var(--accent);font-weight:800}.tasktitle{font-size:16px;font-weight:800;margin:5px 0}.taskdesc{white-space:pre-wrap;color:#bdc8d5;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mini{background:#0d131a;border:1px solid var(--line);border-radius:9px;padding:9px}.mini b{font-size:17px;display:block;margin-top:4px}.issuepanel{border-color:#5f2a35;background:#170e12}.issuepanel.ok{border-color:#23533f;background:#0e1713}.issuehead{display:flex;align-items:center;justify-content:space-between;gap:12px}.badge{font-size:12px;padding:4px 8px;border-radius:999px;background:#4b1f28;color:#ffb1ba;font-weight:800}.badge.ok{background:#15392c;color:#86e6bd}.issues{display:grid;gap:9px}.issue{padding:11px 12px;border:1px solid #5f2a35;border-radius:9px;background:#210f14}.issue .name{font-weight:800}.issue .reason{margin-top:5px;white-space:pre-wrap;color:#f0b8bf;line-height:1.45;font:12px ui-monospace,SFMono-Regular,Menlo,monospace}.errorline{padding:9px 11px;border-left:3px solid var(--bad);background:#170d11;border-radius:6px;white-space:pre-wrap;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.45}.empty{padding:14px;border:1px dashed #315b49;border-radius:9px;color:#84d7b3;background:#0c1612}.loghead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}.log{height:430px;overflow:auto;padding:12px;background:#070b10;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;white-space:pre-wrap}.line{color:#c7d2de}.line.err{color:#ff9fac}.time{color:#566678;margin-right:8px}.toast{position:fixed;right:16px;bottom:16px;display:none;max-width:520px;padding:11px 14px;border-radius:10px;border:1px solid #3b4d60;background:#192431;box-shadow:0 12px 35px #0008;z-index:5}.note{font-size:12px;color:var(--muted);margin-top:8px}.provider-actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}@media(max-width:1150px){.cards{grid-template-columns:repeat(4,1fr)}.grid{grid-template-columns:1fr}.log{height:340px}}@media(max-width:650px){header{align-items:flex-start}.cards{grid-template-columns:repeat(2,1fr)}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header><div><div class="title">AutoDev v2</div><div class="sub">재와별 자율 개발 · HTML 대시보드 · 실제 PID 기반 시작/중지</div></div><div class="actions"><button id="updateBtn" onclick="doUpdate()">업데이트</button><button onclick="apiPost('/api/open-repo')">폴더</button><button id="stopBtn" class="danger" onclick="apiPost('/api/stop')">중지</button><button id="startBtn" class="primary" onclick="apiPost('/api/start')">시작</button></div></header>
<main>
<section class="cards"><div class="card"><div class="k">ENGINE</div><div id="engine" class="v muted">확인 중</div></div><div class="card"><div class="k">CURRENT TASK</div><div id="taskShort" class="v muted">없음</div></div><div class="card"><div class="k">QUEUE</div><div id="queue" class="v">0</div></div><div class="card"><div class="k">DONE</div><div id="done" class="v good">0</div></div><div class="card"><div class="k">ISSUES</div><div id="issuesTop" class="v good">정상</div></div><div class="card"><div class="k">GROK</div><div id="grok" class="v muted">확인 중</div></div><div class="card"><div class="k">CODEX</div><div id="codex" class="v muted">확인 중</div></div></section>
<section id="issuePanel" class="panel issuepanel ok"><h3 class="issuehead"><span>막힘 / 오류 상세</span><span id="issueBadge" class="badge ok">정상</span></h3><div class="body"><div id="issueSummary" class="empty">현재 감지된 막힘이나 오류가 없습니다.</div><div id="blockedList" class="issues" style="margin-top:10px"></div><div id="recentErrors" class="issues" style="margin-top:10px"></div><div id="exitInfo" class="note"></div></div></section>
<section class="grid"><div class="panel"><h3>현재 개발 상태</h3><div class="body"><div class="k">현재 목표</div><div id="goal" class="goal" style="margin-top:6px">아직 목표 없음</div><div class="task"><div id="taskId" class="taskid">대기</div><div id="taskTitle" class="tasktitle">작업 없음</div><div id="taskDesc" class="taskdesc">시작 버튼을 누르면 AutoDev가 현재 상태를 확인합니다.</div></div><div class="stats"><div class="mini"><span class="k">Grok 호출</span><b id="grokCalls">0</b></div><div class="mini"><span class="k">Codex 호출</span><b id="codexCalls">0</b></div><div class="mini"><span class="k">로컬 Director</span><b id="localDirector">0</b></div><div class="mini"><span class="k">막힘</span><b id="blocked">0</b></div></div><div class="provider-actions"><button class="warnbtn" onclick="apiPost('/api/quota/codex/clear')">Codex 한도 재확인</button><button class="warnbtn" onclick="apiPost('/api/quota/grok/clear')">Grok 한도 재확인</button></div><div id="git" class="note">Git 확인 중...</div></div></div><div class="panel"><div class="loghead"><h3 style="border:0;padding:0">실시간 로그</h3><button onclick="clearLogs()">로그 지우기</button></div><div id="log" class="log"></div></div></section>
</main><div id="toast" class="toast"></div>
<script>
const qs=new URLSearchParams(location.search),token=qs.get('token')||'';let lastSeq=0,busy=false;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>x.style.display='none',5000)}
async function getJson(path){const r=await fetch(path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(token),{cache:'no-store',headers:{'X-AutoDev-Token':token}});const d=await r.json();if(!r.ok)throw new Error(d.message||d.error||('HTTP '+r.status));return d}
async function apiPost(path){if(busy)return;busy=true;syncButtons();try{const r=await fetch(path+'?token='+encodeURIComponent(token),{method:'POST',headers:{'X-AutoDev-Token':token}}),d=await r.json();toast(d.message||(d.ok?'완료':'실패'));await new Promise(x=>setTimeout(x,350));await refresh()}catch(e){toast('요청 실패: '+e)}finally{busy=false;syncButtons()}}
async function doUpdate(){if(busy)return;busy=true;syncButtons();try{const r=await fetch('/api/update?token='+encodeURIComponent(token),{method:'POST',headers:{'X-AutoDev-Token':token}}),d=await r.json();toast(d.message||(d.ok?'완료':'실패'));if(d.restarting){setTimeout(waitForRestart,1000);return}}catch(e){toast('업데이트 요청 실패: '+e)}finally{if(!document.hidden){busy=false;syncButtons()}}}
async function waitForRestart(){for(let i=0;i<40;i++){try{const r=await fetch('/',{cache:'no-store'});if(r.ok){location.href='/';return}}catch(e){}await new Promise(x=>setTimeout(x,500))}busy=false;syncButtons();toast('대시보드 재시작 확인 실패. 새로고침해 주세요.')}
async function clearLogs(){await apiPost('/api/clear-logs');document.getElementById('log').innerHTML='';lastSeq=0}
function quotaText(q){if(q&&q.active)return['한도대기','bad'];if(q&&q.detected)return['재확인 가능','warn'];return['사용 가능','good']}
function syncButtons(running){const s=document.getElementById('startBtn'),t=document.getElementById('stopBtn'),u=document.getElementById('updateBtn');if(typeof running==='boolean')window.__running=running;const run=!!window.__running;s.disabled=busy||run;t.disabled=busy||!run;u.disabled=busy}
function renderIssues(s){const count=s.issue_count||0,p=document.getElementById('issuePanel'),badge=document.getElementById('issueBadge'),top=document.getElementById('issuesTop'),summary=document.getElementById('issueSummary'),bl=document.getElementById('blockedList'),re=document.getElementById('recentErrors');top.textContent=count?count+'개':'정상';top.className='v '+(count?'bad':'good');p.className='panel issuepanel '+(count?'':'ok');badge.textContent=count?'문제 '+count+'개':'정상';badge.className='badge '+(count?'':'ok');summary.style.display=count?'none':'block';bl.innerHTML='';for(const x of s.blocked_items||[]){bl.insertAdjacentHTML('beforeend',`<div class="issue"><div class="name">⛔ ${esc(x.id?x.id+' · ':'')}${esc(x.title)}</div><div class="reason">${esc(x.reason)}</div></div>`)}re.innerHTML='';if((s.recent_errors||[]).length){re.insertAdjacentHTML('beforeend','<div class="k" style="margin:4px 0">최근 오류</div>');for(const x of s.recent_errors){re.insertAdjacentHTML('beforeend',`<div class="errorline">${esc(x.time)}  ${esc(x.text)}</div>`)}}const ex=s.last_exit;document.getElementById('exitInfo').textContent=ex===null||ex===undefined?'마지막 종료코드: 없음':`마지막 종료코드: ${ex}${ex===0?' (정상)':' (비정상 종료)'}`}
async function refresh(){try{const s=await getJson('/api/status'),eng=document.getElementById('engine');eng.textContent=s.running?`실행 중 · PID ${s.pid}`:'중지';eng.className='v '+(s.running?'good':'muted');syncButtons(!!s.running);const cur=s.current||{};document.getElementById('taskShort').textContent=cur.title||cur.id||'없음';document.getElementById('queue').textContent=s.queue_count??0;document.getElementById('done').textContent=s.completed_count??0;const g=quotaText(s.grok_quota),c=quotaText(s.codex_quota),ge=document.getElementById('grok'),ce=document.getElementById('codex');ge.textContent=g[0];ge.className='v '+g[1];ce.textContent=c[0];ce.className='v '+c[1];document.getElementById('goal').textContent=s.goal||'아직 목표 없음';document.getElementById('taskId').textContent=cur.id||cur.status||'대기';document.getElementById('taskTitle').textContent=cur.title||'작업 없음';document.getElementById('taskDesc').textContent=cur.goal||cur.description||'현재 작업이 없습니다.';const st=s.stats||{};document.getElementById('grokCalls').textContent=st.grok_calls||0;document.getElementById('codexCalls').textContent=st.codex_calls||0;document.getElementById('localDirector').textContent=st.director_local_calls||0;document.getElementById('blocked').textContent=s.blocked_count??0;document.getElementById('git').textContent=`Git ${s.git?.branch||'?'} · 변경 ${s.git?.dirty_count??'?'}개 · PID ${s.pid||'-'}`;renderIssues(s)}catch(e){const x=document.getElementById('engine');x.textContent='서버 연결 오류';x.className='v bad'}}
async function logs(){try{const d=await getJson('/api/logs?after='+lastSeq),box=document.getElementById('log');let add='';for(const x of d.rows||[]){const err=/(error|exception|failed|timeout|blocked|402|실패|오류|막힘)/i.test(x.text||'');add+=`<div class="line ${err?'err':''}"><span class="time">${esc(x.time)}</span>${esc(x.text)}</div>`}if(add){const near=box.scrollTop+box.clientHeight>box.scrollHeight-80;box.insertAdjacentHTML('beforeend',add);if(near)box.scrollTop=box.scrollHeight}lastSeq=d.last_seq||lastSeq}catch(e){}}
syncButtons(false);refresh();logs();setInterval(refresh,1500);setInterval(logs,700);
</script></body></html>
