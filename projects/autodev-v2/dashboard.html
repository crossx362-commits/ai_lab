<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>AutoDev v2</title>
<style>
:root{color-scheme:dark;--bg:#0a0e13;--panel:#121820;--panel2:#18212b;--line:#273340;--text:#e9eef5;--muted:#8d9bad;--good:#41d89b;--bad:#ff6b78;--warn:#ffc85a;--accent:#72a7ff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}header{height:68px;padding:0 20px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line);background:#0d131a;position:sticky;top:0;z-index:3}.title{font-size:20px;font-weight:800}.sub{font-size:12px;color:var(--muted);margin-top:3px}.actions{display:flex;gap:8px;flex-wrap:wrap}button{border:1px solid var(--line);background:var(--panel2);color:var(--text);padding:9px 14px;border-radius:9px;font-weight:700;cursor:pointer}button:hover{border-color:#51667c}.primary{background:#215ff1;border-color:#215ff1}.danger{background:#4b1f28;border-color:#7b3441}main{padding:16px;display:grid;gap:14px}.cards{display:grid;grid-template-columns:repeat(6,minmax(120px,1fr));gap:10px}.card,.panel{border:1px solid var(--line);background:var(--panel);border-radius:12px}.card{padding:13px;min-height:84px}.k{font-size:11px;color:var(--muted);letter-spacing:.7px;text-transform:uppercase}.v{font-size:19px;font-weight:800;margin-top:8px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:1fr 1.7fr;gap:14px}.panel h3{font-size:13px;margin:0;padding:12px 14px;border-bottom:1px solid var(--line)}.body{padding:14px}.goal{font-size:15px;line-height:1.45}.task{margin-top:12px;padding:12px;border:1px solid var(--line);background:#0d131a;border-radius:10px}.taskid{color:var(--accent);font-weight:800}.tasktitle{font-size:16px;font-weight:800;margin:5px 0}.taskdesc{white-space:pre-wrap;color:#bdc8d5;line-height:1.5}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:12px}.mini{background:#0d131a;border:1px solid var(--line);border-radius:9px;padding:9px}.mini b{font-size:17px;display:block;margin-top:4px}.loghead{display:flex;justify-content:space-between;align-items:center;padding:9px 12px;border-bottom:1px solid var(--line)}.log{height:460px;overflow:auto;padding:12px;background:#070b10;font:12px ui-monospace,SFMono-Regular,Menlo,monospace;line-height:1.5;white-space:pre-wrap}.line{color:#c7d2de}.time{color:#566678;margin-right:8px}.toast{position:fixed;right:16px;bottom:16px;display:none;max-width:460px;padding:11px 14px;border-radius:10px;border:1px solid #3b4d60;background:#192431;box-shadow:0 12px 35px #0008;z-index:5}.note{font-size:12px;color:var(--muted);margin-top:8px}
@media(max-width:1050px){.cards{grid-template-columns:repeat(3,1fr)}.grid{grid-template-columns:1fr}.log{height:360px}}@media(max-width:650px){header{height:auto;padding:12px;align-items:flex-start;gap:10px}.cards{grid-template-columns:repeat(2,1fr)}.actions{justify-content:flex-end}.stats{grid-template-columns:repeat(2,1fr)}}
</style>
</head>
<body>
<header>
  <div><div class="title">AutoDev v2</div><div class="sub">재와별 자율 개발 · HTML 대시보드 · 로컬 Director 우선</div></div>
  <div class="actions">
    <button onclick="apiPost('/api/update')">업데이트</button>
    <button onclick="apiPost('/api/open-repo')">폴더</button>
    <button class="danger" onclick="apiPost('/api/stop')">중지</button>
    <button class="primary" onclick="apiPost('/api/start')">시작</button>
  </div>
</header>
<main>
<section class="cards">
  <div class="card"><div class="k">ENGINE</div><div id="engine" class="v muted">확인 중</div></div>
  <div class="card"><div class="k">CURRENT TASK</div><div id="taskShort" class="v muted">없음</div></div>
  <div class="card"><div class="k">QUEUE</div><div id="queue" class="v">0</div></div>
  <div class="card"><div class="k">DONE</div><div id="done" class="v good">0</div></div>
  <div class="card"><div class="k">GROK</div><div id="grok" class="v muted">확인 중</div></div>
  <div class="card"><div class="k">CODEX</div><div id="codex" class="v muted">확인 중</div></div>
</section>
<section class="grid">
  <div class="panel">
    <h3>현재 개발 상태</h3>
    <div class="body">
      <div class="k">현재 목표</div><div id="goal" class="goal" style="margin-top:6px">아직 목표 없음</div>
      <div class="task"><div id="taskId" class="taskid">대기</div><div id="taskTitle" class="tasktitle">작업 없음</div><div id="taskDesc" class="taskdesc">시작 버튼을 누르면 AutoDev가 현재 상태를 확인합니다.</div></div>
      <div class="stats">
        <div class="mini"><span class="k">Grok 호출</span><b id="grokCalls">0</b></div>
        <div class="mini"><span class="k">Codex 호출</span><b id="codexCalls">0</b></div>
        <div class="mini"><span class="k">로컬 Director</span><b id="localDirector">0</b></div>
        <div class="mini"><span class="k">막힘</span><b id="blocked">0</b></div>
      </div>
      <div id="git" class="note">Git 확인 중...</div>
    </div>
  </div>
  <div class="panel">
    <div class="loghead"><h3 style="border:0;padding:0">실시간 로그</h3><button onclick="clearLogs()">로그 지우기</button></div>
    <div id="log" class="log"></div>
  </div>
</section>
</main>
<div id="toast" class="toast"></div>
<script>
const qs=new URLSearchParams(location.search);const token=qs.get('token')||'';let lastSeq=0;
function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function toast(msg){const x=document.getElementById('toast');x.textContent=msg;x.style.display='block';clearTimeout(window.__tt);window.__tt=setTimeout(()=>x.style.display='none',4500)}
async function getJson(path){const r=await fetch(path+(path.includes('?')?'&':'?')+'token='+encodeURIComponent(token),{cache:'no-store',headers:{'X-AutoDev-Token':token}});return await r.json()}
async function apiPost(path){try{const r=await fetch(path+'?token='+encodeURIComponent(token),{method:'POST',headers:{'X-AutoDev-Token':token}});const d=await r.json();toast(d.message|| (d.ok?'완료':'실패'));if(d.restart_recommended)toast('업데이트 완료. 이 창을 닫고 AutoDev v2 앱을 다시 열면 새 코드가 적용됩니다.');setTimeout(refresh,500)}catch(e){toast('요청 실패: '+e)}}
async function clearLogs(){await apiPost('/api/clear-logs');document.getElementById('log').innerHTML='';lastSeq=0}
function quotaText(q){if(q&&q.active)return ['한도대기','bad'];if(q&&q.detected)return ['재확인 가능','warn'];return ['사용 가능','good']}
async function refresh(){try{const s=await getJson('/api/status');const eng=document.getElementById('engine');eng.textContent=s.running?'실행 중':'중지';eng.className='v '+(s.running?'good':'muted');const cur=s.current||{};document.getElementById('taskShort').textContent=cur.title||cur.id||'없음';document.getElementById('queue').textContent=s.queue_count??0;document.getElementById('done').textContent=s.completed_count??0;const g=quotaText(s.grok_quota),c=quotaText(s.codex_quota);const ge=document.getElementById('grok');ge.textContent=g[0];ge.className='v '+g[1];const ce=document.getElementById('codex');ce.textContent=c[0];ce.className='v '+c[1];document.getElementById('goal').textContent=s.goal||'아직 목표 없음';document.getElementById('taskId').textContent=cur.id||cur.status||'대기';document.getElementById('taskTitle').textContent=cur.title||'작업 없음';document.getElementById('taskDesc').textContent=cur.goal||cur.description||'현재 작업이 없습니다.';const st=s.stats||{};document.getElementById('grokCalls').textContent=st.grok_calls||0;document.getElementById('codexCalls').textContent=st.codex_calls||0;document.getElementById('localDirector').textContent=st.director_local_calls||0;document.getElementById('blocked').textContent=s.blocked_count??0;document.getElementById('git').textContent=`Git ${s.git?.branch||'?'} · 변경 ${s.git?.dirty_count??'?'}개 · PID ${s.pid||'-'}`;}catch(e){document.getElementById('engine').textContent='서버 연결 오류';}}
async function logs(){try{const d=await getJson('/api/logs?after='+lastSeq);const box=document.getElementById('log');let add='';for(const x of d.rows||[]){add+=`<div class="line"><span class="time">${esc(x.time)}</span>${esc(x.text)}</div>`}if(add){const near=box.scrollTop+box.clientHeight>box.scrollHeight-80;box.insertAdjacentHTML('beforeend',add);if(near)box.scrollTop=box.scrollHeight}lastSeq=d.last_seq||lastSeq}catch(e){}}
refresh();logs();setInterval(refresh,2000);setInterval(logs,800);
</script>
</body>
</html>
