name: AutoDev v2 Tests

on:
  push:
    paths:
      - 'projects/autodev-v2/**'
      - 'projects/ai-team/_shared/**'
      - 'projects/ashes-to-stars/unity/Assets/Editor/AutoDevAcceptance/**'
      - '.github/workflows/autodev-v2-tests.yml'
  pull_request:
    paths:
      - 'projects/autodev-v2/**'
      - 'projects/ai-team/_shared/**'
      - 'projects/ashes-to-stars/unity/Assets/Editor/AutoDevAcceptance/**'
      - '.github/workflows/autodev-v2-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python3 -m py_compile \
            projects/autodev-v2/webview_app.py \
            projects/autodev-v2/restart_server.py \
            projects/autodev-v2/codex_usage.py \
            projects/autodev-v2/codex_compat.py \
            projects/autodev-v2/functional_verify.py \
            projects/autodev-v2/runner_entry.py \
            projects/autodev-v2/runner.py \
            projects/autodev-v2/start.py
      - name: Core tests
        run: python3 projects/autodev-v2/tests/test_core.py
      - name: Autonomous loop tests
        run: python3 projects/autodev-v2/tests/test_autonomous_loop.py
      - name: Functional acceptance tests
        run: python3 projects/autodev-v2/tests/test_functional_verify.py
