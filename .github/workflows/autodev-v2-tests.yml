name: AutoDev v2 Tests

on:
  push:
    paths:
      - 'projects/autodev-v2/**'
      - '.github/workflows/autodev-v2-tests.yml'
  pull_request:
    paths:
      - 'projects/autodev-v2/**'
      - '.github/workflows/autodev-v2-tests.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Python syntax check
        run: |
          python3 -m py_compile \
            projects/autodev-v2/runtime_contract.py \
            projects/autodev-v2/engine.py \
            projects/autodev-v2/boot.py \
            projects/autodev-v2/loop.py \
            projects/autodev-v2/start.py \
            projects/autodev-v2/webview_app.py
      - name: New loop tests
        run: python3 projects/autodev-v2/tests/test_loop.py
      - name: Provider-free test guard
        run: |
          python3 - <<'PY'
          from pathlib import Path
          wf = Path('.github/workflows/autodev-v2-tests.yml').read_text(encoding='utf-8')
          for token in ['grok --single', 'grok -p ', 'codex exec']:
              assert token not in wf, token
          print('provider-free CI guard: PASS')
          PY
