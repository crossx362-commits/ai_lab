name: AutoDev audit fix final

on:
  push:
    paths:
      - '.github/workflows/autodev-audit-fix-final.yml'
      - 'projects/autodev-v2/tools/apply_audit_fixes_final.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply deterministic fixes
        run: python3 projects/autodev-v2/tools/apply_audit_fixes_final.py
      - name: Commit fixes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/autodev-v2/runner.py projects/autodev-v2/tests/test_core.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(AutoDev v2): align project areas and Grok flag tests"
            git push origin HEAD:master
          fi
