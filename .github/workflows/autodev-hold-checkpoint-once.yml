name: AutoDev hold checkpoint once

on:
  push:
    paths:
      - '.github/workflows/autodev-hold-checkpoint-once.yml'
      - 'projects/autodev-v2/tools/apply_verification_hold_checkpoint.py'

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Apply checkpoint patch
        run: python3 projects/autodev-v2/tools/apply_verification_hold_checkpoint.py
      - name: Commit patch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add projects/autodev-v2/runner_entry.py
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "fix(AutoDev v2): persist Unity hold rollback checkpoint"
            git push origin HEAD:master
          fi
