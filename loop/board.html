<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>재와 별 · 개발 보드</title>
<style>
  :root {
    --bg: #12100e;
    --panel: #1b1814;
    --line: #2e2922;
    --gold: #d4a24c;
    --ink: #efe8d8;
    --muted: #9a9184;
    --ok: #6cba7a;
    --hold: #e0a050;
    --stop: #d06450;
    --chip: #26221c;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.5 "Apple SD Gothic Neo", "Noto Sans KR", sans-serif; }
  header {
    padding: 20px 24px 12px;
    border-bottom: 1px solid var(--line);
    display: flex; flex-wrap: wrap; gap: 12px 20px; align-items: flex-end;
    justify-content: space-between;
  }
  h1 { margin: 0; font-size: 20px; letter-spacing: .04em; font-weight: 700; }
  h1 span { color: var(--gold); }
  .meta { color: var(--muted); font-size: 13px; }
  .pills { display: flex; gap: 8px; flex-wrap: wrap; }
  .pill {
    border: 1px solid var(--line); background: var(--chip);
    padding: 4px 10px; border-radius: 999px; font-size: 12px; color: var(--muted);
  }
  .pill.on { border-color: var(--gold); color: var(--gold); }
  .pill.bad { border-color: var(--stop); color: var(--stop); }
  .pill.ok { border-color: var(--ok); color: var(--ok); }
  main { display: grid; grid-template-columns: 1.2fr .8fr; gap: 18px; padding: 18px 24px 40px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; padding: 14px; } }
  section {
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 16px 16px 12px;
  }
  h2 { margin: 0 0 12px; font-size: 13px; color: var(--gold); letter-spacing: .08em; text-transform: uppercase; }
  .item { display: flex; gap: 10px; align-items: flex-start; padding: 10px 0; border-top: 1px solid var(--line); }
  .item:first-of-type { border-top: 0; padding-top: 0; }
  .item label { display: flex; gap: 10px; align-items: flex-start; cursor: pointer; flex: 1; }
  .item input { margin-top: 4px; accent-color: var(--gold); }
  .item .t { font-weight: 650; }
  .item .d { color: var(--muted); font-size: 13px; margin-top: 2px; }
  .item.done .t { color: var(--ok); }
  .n { color: var(--gold); font-variant-numeric: tabular-nums; min-width: 1.4em; }
  textarea, input[type=text] {
    width: 100%; background: #100e0c; color: var(--ink); border: 1px solid var(--line);
    border-radius: 8px; padding: 10px 12px; font: inherit;
  }
  textarea { min-height: 110px; resize: vertical; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; align-items: center; }
  button {
    background: var(--gold); color: #1a1408; border: 0; border-radius: 8px;
    padding: 8px 14px; font-weight: 700; cursor: pointer;
  }
  button.ghost { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  button.ghost.on { color: var(--hold); border-color: var(--hold); }
  button:disabled { opacity: .5; cursor: wait; }
  .msg { font-size: 13px; color: var(--ok); min-height: 1.2em; }
  .msg.err { color: var(--stop); }
  .log {
    white-space: pre-wrap; font: 12px/1.45 ui-monospace, Menlo, monospace;
    color: #cfc4b0; background: #100e0c; border-radius: 8px; padding: 10px;
    max-height: 220px; overflow: auto;
  }
  .commit { font-size: 13px; padding: 6px 0; border-top: 1px solid var(--line); display: flex; gap: 8px; }
  .commit:first-of-type { border-top: 0; }
  .hash { color: var(--gold); font-family: ui-monospace, Menlo, monospace; }
  .when { color: var(--muted); min-width: 72px; }
  details.inbox summary { cursor: pointer; color: var(--ink); font-weight: 650; }
  details.inbox { padding: 8px 0; border-top: 1px solid var(--line); }
  details.inbox:first-of-type { border-top: 0; }
  details.inbox p { color: var(--muted); font-size: 13px; margin: 6px 0 0; white-space: pre-wrap; }
  .empty { color: var(--muted); font-size: 13px; }
  .banner {
    display: none; margin: 14px 24px 0; padding: 12px 14px;
    border: 1px solid var(--hold); background: #2a2010; border-radius: 12px;
    align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap;
  }
  .banner.show { display: flex; }
  .banner strong { color: var(--hold); }
  .files { font: 12px/1.45 ui-monospace, Menlo, monospace; max-height: 160px; overflow: auto; }
  .files div { padding: 2px 0; color: var(--muted); }
  .files .ok { color: var(--ink); }
  .files .no { color: var(--stop); text-decoration: line-through; }
  .choice { border: 1px solid var(--gold); border-radius: 10px; padding: 12px; margin-bottom: 10px; background: #221c14; }
  .choice .acts { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  .choice button.pass { background: var(--ok); color: #102214; }
  .choice button.retry { background: transparent; color: var(--hold); border: 1px solid var(--hold); }
  .choice button.skip { background: transparent; color: var(--muted); border: 1px solid var(--line); }
  .badge { font-size: 11px; color: var(--hold); border: 1px solid var(--hold); border-radius: 999px; padding: 0 6px; margin-left: 6px; }
  .request-top {
    margin: 14px 24px 0; padding: 16px 16px 14px; border-radius: 12px;
    border: 1px solid var(--gold); background: #221c14;
  }
  .request-top h2 { margin-bottom: 8px; }
  .stuck-box {
    display: none; margin: 14px 24px 0; padding: 16px 16px 12px; border-radius: 12px;
    border: 1px solid var(--stop); background: #2a1612;
  }
  .stuck-box.show { display: block; }
  .stuck-box h2 { color: var(--stop); }
  .stuck-box .item { align-items: flex-start; }
  .stuck-box .badge.loop { color: var(--stop); border-color: var(--stop); }
  .stuck-box .badge.fail { color: var(--stop); border-color: var(--stop); }
  .stuck-box .badge.blocked { color: var(--hold); border-color: var(--hold); }
  .stuck-box .badge.parked { color: var(--muted); border-color: var(--line); }
  .now-panel {
    margin: 14px 24px 0; padding: 14px 16px; border-radius: 12px;
    border: 1px solid var(--gold); background: #1f1a12;
  }
  .now-panel.idle { border-color: var(--line); background: var(--panel); }
  .now-panel .phase { font-size: 12px; letter-spacing: .08em; color: var(--gold); margin-bottom: 4px; }
  .now-panel.idle .phase { color: var(--muted); }
  .now-panel .t { font-size: 16px; font-weight: 650; }
  .now-panel .log { margin-top: 10px; max-height: 160px; }
  .charts { margin: 14px 24px 0; display: grid; grid-template-columns: 1.15fr 1fr; gap: 14px; }
  @media (max-width: 900px) { .charts { grid-template-columns: 1fr; margin: 14px; } }
  .chart { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px 12px; }
  .bar-row { display: grid; grid-template-columns: 118px 1fr 36px; gap: 8px; align-items: center; margin: 7px 0; }
  .bar-row .lab { font-size: 12px; color: var(--ink); }
  .bar-track { height: 10px; background: #100e0c; border-radius: 99px; overflow: hidden; }
  .bar-fill { height: 100%; background: var(--gold); border-radius: 99px; }
  .bar-fill.ok { background: var(--ok); }
  .bar-fill.hold { background: var(--hold); }
  .bar-fill.muted { background: #3a342c; }
  .bar-row .n { font-size: 12px; color: var(--muted); text-align: right; }
  .stack { display: flex; height: 14px; border-radius: 99px; overflow: hidden; background: #100e0c; margin: 8px 0 6px; }
  .stack span { display: block; height: 100%; }
  .legend { display: flex; gap: 12px; flex-wrap: wrap; font-size: 12px; color: var(--muted); }
  .legend i { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 4px; }
  .spark { display: flex; align-items: flex-end; gap: 3px; height: 76px; margin-top: 8px; }
  .spark b { flex: 1; background: var(--gold); border-radius: 2px 2px 0 0; min-height: 2px; opacity: .85; }
  .spark .cap { font-size: 10px; color: var(--muted); text-align: center; margin-top: 4px; }
  .done-wrap {
    margin: 14px 24px 0; padding: 16px 16px 14px; border-radius: 12px;
    border: 1px solid var(--line); background: var(--panel);
  }
  .done-wrap h2 { color: var(--ok); }
  .done-gallery {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 14px; margin-top: 10px;
  }
  .done-card {
    background: #16130f; border: 1px solid var(--line); border-radius: 10px; overflow: hidden;
  }
  .done-card .thumbs { display: grid; grid-template-columns: 1fr; background: #100e0c; }
  .done-card .thumbs.n2 { grid-template-columns: 1fr 1fr; }
  .done-card img {
    width: 100%; height: 168px; object-fit: cover; object-position: top center;
    display: block; cursor: zoom-in; background: #100e0c;
  }
  .done-card .pad { padding: 11px 12px 12px; }
  .done-card .t { font-weight: 650; }
  .done-card .d { color: var(--muted); font-size: 13px; margin-top: 4px; }
  .done-card .hash { display: inline-block; margin-top: 8px; font-size: 12px; }
  .lightbox {
    display: none; position: fixed; inset: 0; z-index: 50;
    background: rgba(8,6,4,.88); align-items: center; justify-content: center;
    padding: 24px; cursor: zoom-out;
  }
  .lightbox.show { display: flex; }
  .lightbox img { max-width: 96vw; max-height: 92vh; object-fit: contain; border-radius: 8px; }
  .playtest-wrap {
    margin: 14px 24px 0; padding: 16px 16px 14px; border-radius: 12px;
    border: 1px solid var(--gold); background: #1f1a12;
  }
  .playtest-grid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 10px; margin-top: 10px;
  }
  .tester-card {
    background: #16130f; border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
  }
  .tester-card .who { font-weight: 650; }
  .tester-card.ok { border-color: var(--ok); }
  .script-gate { margin-top: 14px; padding-top: 10px; border-top: 1px solid var(--line); }
  .script-gate .t { margin-bottom: 4px; }
  .script-gate ol { margin: 6px 0 0 1.2em; padding: 0; color: var(--muted); font-size: 13px; }
</style>
</head>
<body>
<header>
  <div>
    <h1>재와 별 <span>개발 보드</span></h1>
    <div class="meta" id="updated">불러오는 중…</div>
  </div>
  <div class="pills" id="pills"></div>
</header>
<div class="banner" id="resume-bar">
  <div><strong>중단됨</strong> <span class="meta" id="resume-why"></span></div>
  <button id="btn-continue" type="button">계속 진행</button>
</div>
<section class="request-top">
  <h2>내 요청</h2>
  <p class="meta">루프가 큐보다 먼저 읽는다. 한 줄 제목 + 통과 기준.</p>
  <input type="text" id="req-title" maxlength="80" placeholder="한 줄 제목 — 루프가 맨 먼저 읽는다">
  <textarea id="req-body" placeholder="무엇을, 왜, 통과 기준까지. 모호하면 가장 좁게 해석된다."></textarea>
  <div class="row">
    <label class="meta"><input type="checkbox" id="req-resume"> HOLD 풀고 다음 이터에서 집게</label>
    <button id="req-send" type="button">INBOX에 넣기</button>
    <span class="msg" id="req-msg"></span>
  </div>
</section>
<section class="stuck-box" id="stuck-box">
  <h2>막힘 · 멈춤</h2>
  <p class="meta">루프가 안 돌거나 선행이 없어 선 것만. 끝난 행은 안 올린다.</p>
  <div id="stuck-list"></div>
  <div class="row" id="stuck-acts" style="display:none">
    <button type="button" id="btn-stuck-continue">계속 진행</button>
    <span class="msg" id="stuck-msg"></span>
  </div>
</section>
<section class="now-panel" id="now-box">
  <div class="phase" id="now-phase">지금</div>
  <div class="t" id="now-title">불러오는 중…</div>
  <div class="meta" id="now-meta"></div>
  <div class="log" id="now-log" style="display:none"></div>
</section>
<div class="charts" id="charts"></div>
<section class="playtest-wrap" id="playtest-box">
  <h2>V4 외부 테스터 10</h2>
  <p class="meta" id="playtest-meta">키트를 불러오는 중…</p>
  <div class="playtest-grid" id="playtest-grid"></div>
  <div id="playtest-script"></div>
</section>
<section class="done-wrap" id="done-wrap">
  <h2>완료된 개발</h2>
  <p class="meta">STATUS에 근거가 남은 것만. 그림은 QA가 찍은 실측 샷이다.</p>
  <div class="done-gallery" id="done-gallery"></div>
</section>
<div class="lightbox" id="lightbox"><img id="lightbox-img" alt=""></div>
<main>
  <div>
    <section>
      <h2>내 선택</h2>
      <p class="meta" id="choice-hint">기획서·STATUS 큐에서 고른다. 「이걸로 진행」이 다음 할 일이 된다.</p>
      <div id="choices"></div>
      <span class="msg" id="choice-msg"></span>
    </section>
    <section style="margin-top:18px">
      <h2>원장 관문</h2>
      <div id="milestones"></div>
    </section>
    <section style="margin-top:18px">
      <h2>다음 할 일</h2>
      <div id="queue"></div>
    </section>
  </div>
  <div>
    <section>
      <h2>루프</h2>
      <div class="row" id="loop-btns">
        <button type="button" id="btn-continue-2">계속 진행</button>
        <button class="ghost" data-act="hold" type="button">HOLD</button>
        <button class="ghost" data-act="stop" type="button">STOP</button>
      </div>
      <span class="msg" id="loop-msg"></span>
      <div class="log" id="log" style="margin-top:12px"></div>
    </section>
    <section style="margin-top:18px">
      <h2>최근 완료</h2>
      <div id="results"></div>
    </section>
    <section style="margin-top:18px">
      <h2>INBOX 대기</h2>
      <div id="inbox"></div>
    </section>
    <section style="margin-top:18px">
      <h2>커밋</h2>
      <div class="files" id="dirty"></div>
      <input type="text" id="commit-msg" maxlength="120" placeholder="커밋 메시지 (비우면 자동)" style="margin-top:10px">
      <div class="row">
        <button id="btn-commit" type="button">커밋</button>
        <span class="msg" id="commit-msg-out"></span>
      </div>
    </section>
    <section style="margin-top:18px">
      <h2>최근 커밋</h2>
      <div id="commits"></div>
    </section>
  </div>
</main>
<script>
const $ = (id) => document.getElementById(id);

async function api(path, body) {
  const opt = body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {};
  const r = await fetch(path, opt);
  const data = await r.json();
  if (!r.ok || data.ok === false) throw new Error(data.error || r.statusText);
  return data;
}

function checked(state, id) { return Boolean(state.checks && state.checks[id]); }

function renderItems(el, items, state, extra) {
  if (!items.length) { el.innerHTML = '<p class="empty">없음</p>'; return; }
  el.innerHTML = items.map((it) => {
    const on = it.done || checked(state, it.id);
    return `<div class="item${on ? " done" : ""}">
      ${it.n ? `<span class="n">${it.n}</span>` : ""}
      <label>
        <input type="checkbox" data-id="${it.id}" ${on && !it.done ? "checked" : ""} ${it.done ? "checked disabled" : ""}>
        <div><div class="t">${esc(it.title)}${it.human && !it.done ? '<span class="badge">내 선택</span>' : ""}</div><div class="d">${esc(it.detail || "")}</div></div>
      </label>
    </div>`;
  }).join("");
  extra && extra();
}

function esc(s) {
  return String(s || "").replace(/[&<>"']/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;" }[c]));
}

function renderPlaytest(state) {
  const box = $("playtest-box");
  const grid = $("playtest-grid");
  const meta = $("playtest-meta");
  if (!box || !grid) return;
  const P = state.playtest || {};
  const rows = P.sessions || [];
  box.style.display = rows.length ? "block" : "none";
  if (!rows.length) return;
  meta.textContent = P.ran
    ? `세션 ${P.ran}/10 · 삭제 ${P.deleted} · 계속 경로 ${P.continued} · 사람 70%는 아직 (${P.ran_at || ""})`
    : "10명 키트. 각자 이름을 붙인 캐릭터를 키운 뒤 삭제한다. 70%는 사람 응답.";
  grid.innerHTML = rows.map((t) => `
    <article class="tester-card${t.deleted ? " ok" : ""}">
      <div class="who">${esc(t.tester)} · ${esc(t.favorite)}</div>
      <div class="d">${esc(t.job)}${t.first ? " → " + esc(t.first) : ""} · ${t.minutes || "?"}분
        ${t.level != null ? " · Lv" + t.level : ""}
        ${t.gear ? " · 장비" : ""}</div>
      <div class="d">${t.ran
        ? (t.deleted ? "삭제됨" : "삭제안됨") + " · 생존 " + (t.living ?? "?") + (t.continued ? " · 남은 파티로 계속" : "")
        : "세션 대기"}</div>
    </article>`).join("");
  const scriptEl = $("playtest-script");
  const script = P.script || {};
  const gates = script.gates || [];
  if (scriptEl) {
    scriptEl.innerHTML = gates.length ? gates.map((g) => `
      <div class="script-gate">
        <div class="t">${esc(g.id)} · ${esc(g.title)}</div>
        <div class="d">통과: ${esc(g.pass)} · ${ (g.testers || []).length }명</div>
        <ol>${(g.steps || []).map((s) =>
          `<li><strong>${esc(s.id)}</strong> ${esc(s.do)} — ${esc(s.record)}</li>`
        ).join("")}</ol>
      </div>`).join("") +
      `<p class="meta" style="margin-top:10px">시험지 ${esc(P.doc || "")} · 응답란 ${esc(P.sheet || "")}. 사람 70%는 여기 답을 채우기 전에 닫지 않는다.</p>`
      : "";
  }
}

function renderCompleted(state) {
  const wrap = $("done-wrap");
  const el = $("done-gallery");
  if (!wrap || !el) return;
  const items = state.completed || [];
  wrap.style.display = items.length ? "block" : "none";
  el.innerHTML = items.map((it) => {
    const shots = it.shots || [];
    const thumbs = shots.length ? `<div class="thumbs${shots.length > 1 ? " n2" : ""}">${
      shots.map((s) => `<img src="${esc(s.url)}" alt="${esc(it.title)}" data-full="${esc(s.url)}">`).join("")
    }</div>` : "";
    return `<article class="done-card">${thumbs}
      <div class="pad">
        <div class="t">${esc(it.title)}</div>
        <div class="d">${esc(it.detail || "")}</div>
        ${it.commit ? `<span class="hash">${esc(it.commit)}</span>` : ""}
      </div>
    </article>`;
  }).join("");
}

function renderStuck(state) {
  const box = $("stuck-box");
  const list = $("stuck-list");
  const acts = $("stuck-acts");
  if (!box || !list) return;
  const items = state.stuck || [];
  box.classList.toggle("show", items.length > 0);
  if (!items.length) {
    list.innerHTML = "";
    if (acts) acts.style.display = "none";
    return;
  }
  const kinds = { loop: "루프", fail: "실패", blocked: "선행 막힘", parked: "보류" };
  list.innerHTML = items.map((it) => `
    <div class="item">
      <span class="badge ${esc(it.kind || "")}">${esc(kinds[it.kind] || it.kind || "")}</span>
      <div><div class="t">${esc(it.title)}</div><div class="d">${esc(it.detail || "")}</div></div>
    </div>`).join("");
  if (acts) acts.style.display = items.some((it) => it.kind === "loop") ? "flex" : "none";
}

function render(state) {
  $("updated").textContent = "STATUS 갱신 · " + (state.updated || "시각 없음");
  const L = state.loop || {};
  $("pills").innerHTML = [
    `<span class="pill on">실행기 ${esc(L.agent || "?")}</span>`,
    L.running ? `<span class="pill ok">루프 가동</span>` : `<span class="pill bad">루프 꺼짐</span>`,
    L.hold ? `<span class="pill bad">HOLD</span>` : "",
    L.stop ? `<span class="pill bad">STOP</span>` : "",
    L.latest_iter ? `<span class="pill">${esc(L.latest_iter)}</span>` : "",
  ].join("");
  const blocked = L.blocked || [];
  $("resume-bar").classList.toggle("show", blocked.length > 0);
  $("resume-why").textContent = blocked.length ? blocked.join(" · ") : "";
  const now = L.now || {};
  $("now-box").classList.toggle("idle", now.phase !== "작업 중");
  $("now-phase").textContent = now.phase === "작업 중"
    ? ("지금 작업 중" + (now.number ? " · #" + now.number : ""))
    : (now.phase || "지금");
  $("now-title").textContent = now.title || "상태 없음";
  $("now-meta").textContent = [now.started && ("시작 " + now.started), now.iter].filter(Boolean).join(" · ");
  const act = (now.activity || []).join("\n");
  $("now-log").style.display = act ? "block" : "none";
  $("now-log").textContent = act;
  const pending = state.choices || [];
  $("choice-hint").style.display = pending.length ? "block" : "none";
  $("choices").innerHTML = pending.length ? pending.map((it) => `
    <div class="choice" data-id="${it.id}">
      <div class="t">${esc(it.title)}</div>
      <div class="d">${esc(it.detail)}</div>
      <input type="text" class="choice-note" placeholder="메모 (선택)" style="margin-top:8px">
      <div class="acts">
        <button type="button" class="pass" data-choice="do">이걸로 진행</button>
        <button type="button" class="retry" data-choice="pass">완료</button>
        <button type="button" class="skip" data-choice="skip">보류</button>
      </div>
    </div>`).join("") : '<p class="empty">지금 고를 사람 판정은 없다</p>';
  renderStuck(state);
  renderPlaytest(state);
  renderCompleted(state);
  renderItems($("milestones"), state.milestones || [], state);
  renderItems($("queue"), state.queue || [], state);
  $("log").textContent = L.log_tail || "(루프 로그 없음)";
  const dirty = state.git || [];
  const allowN = dirty.filter((f) => f.allowed).length;
  $("dirty").innerHTML = dirty.length ? dirty.map((f) =>
    `<div class="${f.allowed ? "ok" : "no"}">${esc(f.code)} ${esc(f.path)}</div>`
  ).join("") + `<div class="ok">${allowN}개 커밋 가능</div>` : '<p class="empty">깨끗한 작업 트리</p>';
  $("btn-commit").disabled = allowN === 0;
  const results = state.results || [];
  $("results").innerHTML = results.length ? results.map((it) => `
    <div class="item${checked(state, it.id) ? " done" : ""}">
      <label>
        <input type="checkbox" data-id="${it.id}" ${checked(state, it.id) ? "checked" : ""}>
        <div><div class="t">${esc(it.title)}</div>
        <div class="d">${it.commit ? it.commit + " · " : ""}${esc((it.body || "").slice(0, 180))}</div></div>
      </label>
    </div>`).join("") : '<p class="empty">기록 없음</p>';
  const waiting = (state.inbox && state.inbox.waiting) || [];
  $("inbox").innerHTML = waiting.length ? waiting.map((it) => `
    <details class="inbox"><summary>${esc(it.title)}</summary><p>${esc(it.body)}</p></details>
  `).join("") : '<p class="empty">대기 지시 없음 — 아래 요청이 여기로 간다</p>';
  const commits = state.commits || [];
  $("commits").innerHTML = commits.length ? commits.map((c) => `
    <div class="commit"><span class="hash">${esc(c.hash)}</span><span class="when">${esc(c.when)}</span><span>${esc(c.subject)}</span></div>
  `).join("") : '<p class="empty">커밋 없음</p>';
  renderCharts(state.charts || {});
}

function barClass(pct) {
  if (pct >= 100) return "ok";
  if (pct > 0) return "hold";
  return "muted";
}

function renderCharts(c) {
  const el = $("charts");
  if (!el) return;
  const gates = c.gates || [];
  const weeks = c.weeks || [];
  const q = c.queue || { done: 0, open: 0, blocked: 0, total: 0 };
  const art = c.art || [];
  const spark = c.commits || [];
  const road = c.roadmap || [];
  const qTot = q.total || 1;
  const artMax = Math.max(1, ...art.map((a) => a.n));
  const sparkMax = Math.max(1, ...spark.map((s) => s.n));
  const bars = (rows) => rows.map((r) => {
    const pct = r.pct == null ? 0 : r.pct;
    return `<div class="bar-row"><div class="lab">${esc(r.label)}</div>
      <div class="bar-track"><div class="bar-fill ${barClass(pct)}" style="width:${pct}%"></div></div>
      <div class="n">${pct}%</div></div>`;
  }).join("");
  el.innerHTML = `
    <section class="chart">
      <h2>프로토타입 관문</h2>
      ${bars(gates)}
      <div class="legend" style="margin-top:8px">STATUS·DESIGN·보드 결정에서 집계. V4 70%는 사람만 닫는다.</div>
    </section>
    <section class="chart">
      <h2>로드맵 · 주차별</h2>
      ${bars(road)}
      ${weeks.map((w) => `<div class="bar-row"><div class="lab">${esc(w.id)}</div>
        <div class="bar-track"><div class="bar-fill ${barClass(w.pct)}" style="width:${w.pct}%"></div></div>
        <div class="n">${w.pct}%</div></div>`).join("")}
    </section>
    <section class="chart">
      <h2>STATUS 큐 ${q.total}항</h2>
      <div class="stack">
        <span style="width:${100*q.done/qTot}%;background:var(--ok)"></span>
        <span style="width:${100*q.open/qTot}%;background:var(--gold)"></span>
        <span style="width:${100*q.blocked/qTot}%;background:var(--hold)"></span>
      </div>
      <div class="legend">
        <span><i style="background:var(--ok)"></i>완료 ${q.done}</span>
        <span><i style="background:var(--gold)"></i>열림 ${q.open}</span>
        <span><i style="background:var(--hold)"></i>선행 막힘 ${q.blocked}</span>
      </div>
    </section>
    <section class="chart">
      <h2>Resources ${art.reduce((s,a)=>s+a.n,0)}장</h2>
      ${art.map((a) => `<div class="bar-row"><div class="lab">${esc(a.id)}</div>
        <div class="bar-track"><div class="bar-fill" style="width:${100*a.n/artMax}%"></div></div>
        <div class="n">${a.n}</div></div>`).join("")}
      <div class="spark">${spark.map((s) =>
        `<b title="${esc(s.day)} ${s.n}커밋" style="height:${Math.max(4, 76*s.n/sparkMax)}px"></b>`
      ).join("")}</div>
      <div class="legend">아래 막대는 최근 14일 게임 커밋 수</div>
    </section>`;
}

async function refresh() {
  const state = await api("/api/state");
  render(state);
}

document.addEventListener("change", async (e) => {
  const box = e.target.closest("input[type=checkbox][data-id]");
  if (!box) return;
  try {
    await api("/api/check", { id: box.dataset.id, done: box.checked });
    await refresh();
  } catch (err) { alert(err.message); }
});

$("req-send").onclick = async () => {
  const title = $("req-title").value.trim();
  const body = $("req-body").value.trim();
  const msg = $("req-msg");
  msg.className = "msg";
  if (!title) { msg.className = "msg err"; msg.textContent = "제목이 필요하다"; return; }
  $("req-send").disabled = true;
  try {
    const r = await api("/api/request", { title, body, resume: $("req-resume").checked });
    msg.textContent = "넣음 · " + r.at;
    $("req-title").value = "";
    $("req-body").value = "";
    await refresh();
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = err.message;
  } finally {
    $("req-send").disabled = false;
  }
};

$("choices").onclick = async (e) => {
  const btn = e.target.closest("button[data-choice]");
  if (!btn) return;
  const card = btn.closest(".choice");
  const note = card.querySelector(".choice-note").value.trim();
  const msg = $("choice-msg");
  msg.className = "msg";
  btn.disabled = true;
  try {
    const r = await api("/api/decide", { id: card.dataset.id, choice: btn.dataset.choice, note, resume: true });
    msg.textContent = r.title + " → " + ({ do: "이걸로 진행", pass: "완료", retry: "다시", skip: "보류" }[r.choice] || r.choice);
    await refresh();
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = err.message;
  } finally {
    btn.disabled = false;
  }
};

async function resumeLoop() {
  const msg = $("loop-msg");
  msg.className = "msg";
  try {
    const r = await api("/api/loop", { action: "continue" });
    msg.textContent = r.started ? "루프를 다시 켰다" : "중단을 풀고 이어서 돈다";
    await refresh();
  } catch (err) {
    msg.className = "msg err";
    msg.textContent = err.message;
  }
}
$("btn-continue").onclick = resumeLoop;
$("btn-continue-2").onclick = resumeLoop;
$("btn-stuck-continue").onclick = resumeLoop;

$("loop-btns").onclick = async (e) => {
  const btn = e.target.closest("button[data-act]");
  if (!btn) return;
  try {
    await api("/api/loop", { action: btn.dataset.act });
    await refresh();
  } catch (err) { alert(err.message); }
};

$("btn-commit").onclick = async () => {
  const out = $("commit-msg-out");
  out.className = "msg";
  $("btn-commit").disabled = true;
  try {
    const r = await api("/api/commit", { message: $("commit-msg").value.trim() });
    out.textContent = r.hash + " · " + r.subject;
    $("commit-msg").value = "";
    await refresh();
  } catch (err) {
    out.className = "msg err";
    out.textContent = err.message;
  } finally {
    $("btn-commit").disabled = false;
  }
};

$("done-gallery").onclick = (e) => {
  const img = e.target.closest("img[data-full]");
  if (!img) return;
  $("lightbox-img").src = img.dataset.full;
  $("lightbox").classList.add("show");
};
$("lightbox").onclick = () => {
  $("lightbox").classList.remove("show");
  $("lightbox-img").src = "";
};

refresh().catch((err) => { $("updated").textContent = "불러오기 실패: " + err.message; });
setInterval(() => refresh().catch(() => {}), 8000);
</script>
</body>
</html>
